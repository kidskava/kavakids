<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kava Kids — Sistema de Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --laranja:#F47C1B; --laranja-2:#FF8C1E; --laranja-fraco:#FDEBD9;
  --marrom:#994E11; --marrom-2:#7A3E0D;
  --ciano:#4FC3D9; --amarelo:#F2B705; --coral:#F0736A; --verde:#8FC93A;
  --texto:#474747; --texto-fraco:#7d7469;
  --bg:#FBF6F0; --card:#FFFFFF; --linha:#EADFD2; --linha-2:#F3EBE1;
  --sombra:0 1px 2px rgba(72,45,20,.06), 0 6px 18px rgba(72,45,20,.07);
  --r:14px;
  --sans:"Fira Sans","Segoe UI",system-ui,sans-serif;
  --display:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--texto); font-family:var(--sans);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:700; margin:0; letter-spacing:-.01em}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--marrom)}

/* ---------- LOGO ---------- */
.logo{display:flex; align-items:center; gap:10px; user-select:none}
.logo .tatu{width:38px;height:38px;flex:none}
.logo .wm{line-height:1}
.logo .kava{font-family:var(--display); font-weight:800; font-size:23px; color:var(--laranja);
  letter-spacing:-.5px; display:block; text-shadow:0 1px 0 #fff}
.logo .kids{font-family:var(--display); font-weight:800; font-size:14px; letter-spacing:2.5px; display:block; margin-top:-2px}
.logo .kids i{font-style:normal}
.logo .kids i:nth-child(1){color:var(--ciano)}
.logo .kids i:nth-child(2){color:var(--amarelo)}
.logo .kids i:nth-child(3){color:var(--coral)}
.logo .kids i:nth-child(4){color:var(--verde)}

/* ---------- LAYOUT ---------- */
.app{display:flex; min-height:100vh}
.side{
  width:224px; flex:none; background:var(--card); border-right:1px solid var(--linha);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh
}
.side .top{padding:18px 16px 14px; border-bottom:1px solid var(--linha-2)}
.nav{padding:10px; display:flex; flex-direction:column; gap:2px; overflow:auto; flex:1}
.nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:0; padding:10px 12px; border-radius:10px; cursor:pointer;
  color:var(--texto-fraco); font-weight:500; font-size:14.5px
}
.nav button svg{width:19px;height:19px;flex:none;opacity:.8}
.nav button:hover{background:var(--linha-2); color:var(--marrom)}
.nav button.on{background:var(--laranja); color:#fff}
.nav button.on svg{opacity:1}
.side .foot{padding:12px 14px; border-top:1px solid var(--linha-2); font-size:11.5px; color:var(--texto-fraco)}

.main{flex:1; min-width:0; padding:22px 26px 60px}
.head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.head h1{font-size:25px; color:var(--marrom)}
.head p{margin:2px 0 0; color:var(--texto-fraco); font-size:13.5px}

/* ---------- COMPONENTES ---------- */
.card{background:var(--card); border:1px solid var(--linha); border-radius:var(--r); box-shadow:var(--sombra)}
.card>.ch{padding:14px 18px; border-bottom:1px solid var(--linha-2); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
.card>.ch h3{font-size:15.5px; color:var(--marrom)}
.card>.cb{padding:18px}
.grid{display:grid; gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end}

label.f{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600;
  color:var(--texto-fraco); text-transform:uppercase; letter-spacing:.4px; flex:1 1 150px; min-width:0}
input,select,textarea{
  background:#fff; border:1.5px solid var(--linha); border-radius:9px; padding:9px 11px;
  font-size:14.5px; font-weight:400; text-transform:none; letter-spacing:0; width:100%
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--laranja); box-shadow:0 0 0 3px rgba(244,124,27,.15)}
input[readonly]{background:var(--linha-2); color:var(--texto-fraco)}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; border:0; cursor:pointer;
  background:var(--laranja); color:#fff; font-weight:600; font-size:14.5px; padding:10px 16px; border-radius:9px;
  font-family:var(--sans); white-space:nowrap}
.btn:hover{background:var(--laranja-2)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:#fff; color:var(--marrom); border:1.5px solid var(--linha)}
.btn.sec:hover{background:var(--linha-2)}
.btn.gh{background:transparent; color:var(--texto-fraco); padding:7px 10px}
.btn.gh:hover{background:var(--linha-2); color:var(--marrom)}
.btn.dan{background:var(--coral)}
.btn.dan:hover{background:#e2564c}
.btn.ok{background:var(--verde); color:#2c4a08}
.btn.big{font-size:16px; padding:13px 22px}
.btn.sm{font-size:13px; padding:6px 11px; border-radius:8px}
.btn:disabled{opacity:.45; cursor:not-allowed}

table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-fraco);
  font-weight:700; padding:9px 10px; border-bottom:1.5px solid var(--linha); white-space:nowrap}
td{padding:9px 10px; border-bottom:1px solid var(--linha-2); vertical-align:middle}
tbody tr:hover{background:#FFFCF8}
.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
.tw{overflow-x:auto}
.mono{font-variant-numeric:tabular-nums}

.tag{display:inline-block; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700;
  background:var(--linha-2); color:var(--marrom); white-space:nowrap}
.tag.m{background:#DFF1F7; color:#1d7f99}
.tag.f{background:#FDE4E2; color:#c14a41}
.tag.u{background:#EEF6DF; color:#5b8215}
.tag.e{background:#EAF7DC; color:#4f7a10}
.tag.s{background:#FDE9E7; color:#c14a41}
.tag.c{background:#F0EAE3; color:#8a7a68; text-decoration:line-through}
.tag.al{background:#FDECD5; color:#a25c07}

.kpi{background:var(--card); border:1px solid var(--linha); border-radius:var(--r); padding:15px 17px; box-shadow:var(--sombra)}
.kpi .k{font-size:11.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--texto-fraco); font-weight:700}
.kpi .v{font-family:var(--display); font-size:26px; font-weight:800; margin-top:5px; color:var(--marrom); letter-spacing:-.5px}
.kpi .s{font-size:12.5px; color:var(--texto-fraco); margin-top:3px}
.kpi.lar{border-top:3px solid var(--laranja)}
.kpi.ver{border-top:3px solid var(--verde)}
.kpi.cor{border-top:3px solid var(--coral)}
.kpi.cia{border-top:3px solid var(--ciano)}
.kpi.ama{border-top:3px solid var(--amarelo)}
.pos{color:#4f7a10} .neg{color:#c14a41}

.vazio{text-align:center; padding:38px 20px; color:var(--texto-fraco)}
.vazio b{display:block; font-family:var(--display); font-size:16px; color:var(--marrom); margin-bottom:4px}

.scan{display:flex; align-items:center; gap:12px; background:linear-gradient(100deg,var(--laranja),#ffa23f);
  padding:16px 18px; border-radius:var(--r); box-shadow:var(--sombra)}
.scan svg{width:30px;height:30px;color:#fff;flex:none}
.scan .l{color:#fff; font-weight:700; font-family:var(--display); font-size:15px; line-height:1.25}
.scan .l small{display:block; font-weight:500; font-size:12px; opacity:.9; font-family:var(--sans)}
.scan input{border:0; font-size:19px; font-weight:700; padding:12px 14px; border-radius:10px; font-variant-numeric:tabular-nums}
.scan input:focus{box-shadow:0 0 0 4px rgba(255,255,255,.45)}

.modal{position:fixed; inset:0; background:rgba(60,36,12,.45); display:flex; align-items:flex-start;
  justify-content:center; padding:40px 16px; overflow:auto; z-index:50; backdrop-filter:blur(2px)}
.modal[hidden]{display:none}
.modal .box{background:var(--card); border-radius:16px; width:100%; max-width:620px; box-shadow:0 20px 60px rgba(60,36,12,.3)}
.modal .box.wide{max-width:840px}
.modal .mh{padding:16px 20px; border-bottom:1px solid var(--linha-2); display:flex; justify-content:space-between; align-items:center}
.modal .mh h3{font-size:17px; color:var(--marrom)}
.modal .mb{padding:20px}
.modal .mf{padding:14px 20px; border-top:1px solid var(--linha-2); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}

.toast{position:fixed; right:18px; bottom:18px; z-index:99; display:flex; flex-direction:column; gap:8px}
.toast div{background:var(--marrom); color:#fff; padding:11px 16px; border-radius:10px; font-size:14px;
  box-shadow:0 8px 24px rgba(0,0,0,.2); animation:up .25s ease}
.toast div.err{background:var(--coral)}
.toast div.ok{background:#5b8215}
@keyframes up{from{opacity:0; transform:translateY(8px)}}

.bar{display:flex; align-items:flex-end; gap:10px; height:170px; padding-top:10px}
.bar .b{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:0}
.bar .b .col{width:100%; max-width:52px; border-radius:6px 6px 0 0; background:var(--laranja); position:relative}
.bar .b .col.c2{background:var(--marrom)}
.bar .b .lb{font-size:11px; color:var(--texto-fraco); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
.bar .b .vl{font-size:11px; font-weight:700; color:var(--marrom); font-variant-numeric:tabular-nums}
.leg{display:flex; gap:14px; font-size:12px; color:var(--texto-fraco); margin-top:8px}
.leg i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px}

/* seletor entrada/saída do módulo de troca */
.modo{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.modo button{
  display:block; text-align:left; cursor:pointer; padding:14px 16px; border-radius:var(--r);
  border:2.5px solid var(--linha); background:#fff; color:var(--texto-fraco);
  font-family:var(--display); font-weight:800; font-size:17px; letter-spacing:-.2px; line-height:1.2
}
.modo button small{display:block; font-family:var(--sans); font-weight:500; font-size:12.5px;
  letter-spacing:0; margin-top:3px; opacity:.85}
.modo button:hover{border-color:var(--texto-fraco)}
.modo button.ent.on{background:#EAF7DC; border-color:#7fae2b; color:#3f6b06}
.modo button.sai.on{background:var(--laranja-fraco); border-color:var(--laranja); color:var(--marrom)}
.modo button kbd{font-family:var(--sans); font-size:11px; font-weight:700; background:rgba(0,0,0,.09);
  padding:1px 6px; border-radius:5px; margin-left:6px; vertical-align:middle}

/* alerta de estoque insuficiente */
.semEstoque{
  display:flex; align-items:center; gap:12px; background:#c14a41; color:#fff;
  padding:13px 16px; border-radius:var(--r); box-shadow:var(--sombra);
  animation:up .2s ease; flex-wrap:wrap
}
.semEstoque .ic{font-size:24px; line-height:1; flex:none}
.semEstoque .t{flex:1 1 240px; min-width:200px; font-family:var(--display);
  font-weight:800; font-size:17px; line-height:1.2}
.semEstoque .acoes{display:flex; gap:8px; flex:none; margin-left:auto}
.semEstoque .t small{display:block; font-family:var(--sans); font-weight:500; font-size:12.5px; opacity:.92; margin-top:2px}
.semEstoque button{background:rgba(255,255,255,.2); color:#fff; border:0; border-radius:8px;
  padding:7px 12px; cursor:pointer; font-weight:600; font-size:13px; flex:none}
.semEstoque button:hover{background:rgba(255,255,255,.32)}
.semEstoque .codLido{font-family:ui-monospace,Consolas,monospace; font-size:15px;
  letter-spacing:1px; background:rgba(255,255,255,.22); padding:1px 6px; border-radius:5px}
.semEstoque .parecidos{margin-top:9px; display:flex; flex-direction:column; gap:6px}
.semEstoque .pl{display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:rgba(255,255,255,.14); padding:7px 10px; border-radius:9px;
  font-family:var(--sans); font-weight:500; font-size:12.5px; line-height:1.35}
.semEstoque .pl i{font-style:normal; opacity:.85; font-size:11px}
.semEstoque .pl button{flex:none}

.faixaEnt{border-left:4px solid #7fae2b}
.faixaSai{border-left:4px solid var(--laranja)}

.pill{display:flex; gap:6px; flex-wrap:wrap}
.pill button{background:#fff; border:1.5px solid var(--linha); color:var(--texto-fraco); padding:6px 13px;
  border-radius:999px; cursor:pointer; font-size:13px; font-weight:600}
.pill button:hover{border-color:var(--laranja); color:var(--marrom)}
.pill button.on{background:var(--marrom); border-color:var(--marrom); color:#fff}

.sep{height:1px; background:var(--linha-2); margin:16px 0}
.hint{font-size:12.5px; color:var(--texto-fraco); line-height:1.45}
.tot{display:flex; justify-content:space-between; padding:5px 0; font-size:14.5px}
.tot.big{font-family:var(--display); font-size:24px; font-weight:800; color:var(--marrom); border-top:2px solid var(--linha); margin-top:8px; padding-top:12px}

@media(max-width:860px){
  .app{flex-direction:column}
  .side{width:100%; height:auto; position:static; flex-direction:row; align-items:center; overflow-x:auto}
  .side .top{border:0; padding:12px 14px}
  .side .foot{display:none}
  .nav{flex-direction:row; padding:8px}
  .nav button span{display:none}
  .main{padding:16px 14px 50px}
}

/* ---------- IMPRESSÃO ----------
   Dois modos: com a classe "imp-recibo" sai SÓ o cupom (nunca a tela, que
   mostra custo e lucro); sem ela, sai a tela — usado nos relatórios. */
#recibo{display:none}

/* Cupom para bobina térmica. Padrão 80 mm (área de impressão 72 mm).
   Térmica é 203 dpi e imprime só preto: nada de cinza, sombra, fundo
   colorido ou traço fino demais — tudo isso sai borrado ou não sai. */
.recibo-doc{
  width:var(--cupomW, 72mm); max-width:100%; margin:0 auto;
  padding:2mm 0 14mm;                 /* folga no fim para a lâmina do cortador */
  color:#000; background:#fff;
  font-family:var(--sans); font-size:9.5pt; line-height:1.32;
  -webkit-font-smoothing:none
}
.recibo-doc *{color:#000 !important; background:transparent !important; box-shadow:none !important}
.recibo-doc .marca{font-family:var(--display); font-weight:800; font-size:19pt; letter-spacing:.6px; line-height:1.05}
.recibo-doc .topo{text-align:center; margin-bottom:2.5mm}
.recibo-doc .topo div{font-size:8pt; line-height:1.35}
.recibo-doc .topo .doc{font-weight:700; font-size:9pt; margin-top:1.2mm}
.recibo-doc .hr{border-top:.35mm solid #000; margin:2mm 0}
.recibo-doc .hr.fina{border-top-width:.2mm; margin:1.2mm 0}
.recibo-doc .tarja{border:.5mm solid #000; padding:1.6mm; text-align:center;
  font-weight:800; font-size:10pt; margin-bottom:2.5mm; line-height:1.25}
.recibo-doc .tarja span{display:block; font-weight:400; font-size:7.5pt; margin-top:.5mm}
.recibo-doc .cab{display:flex; justify-content:space-between; font-size:7.5pt;
  font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-bottom:.8mm}
.recibo-doc .item{margin:1.6mm 0}
.recibo-doc .item .d{font-size:9pt; line-height:1.25; word-break:break-word}
.recibo-doc .item .q{display:flex; justify-content:space-between; gap:3mm; font-size:8.5pt; margin-top:.3mm}
.recibo-doc .lin{display:flex; justify-content:space-between; gap:3mm; padding:.4mm 0; font-size:9pt}
.recibo-doc .lin.forte{font-weight:700}
.recibo-doc .lin.total{font-family:var(--display); font-weight:800; font-size:14pt; line-height:1.15; padding:1mm 0}
.recibo-doc .rodape{text-align:center; font-size:7.5pt; margin-top:4mm; line-height:1.4}
.recibo-doc .secao{font-weight:800; font-size:8.5pt; text-transform:uppercase;
  letter-spacing:.6px; text-align:center; padding:.4mm 0}
.recibo-doc .q.sub{font-size:7.5pt; padding-left:2.5mm}
.recibo-doc.rel .item{margin:1.1mm 0}
.recibo-doc.rel .lin{font-size:8.5pt}
.recibo-doc.rel .lin.destaque{font-weight:800; font-size:10pt; padding:.8mm 0}
.recibo-doc .vazio-cupom{text-align:center; font-size:8pt; padding:2mm 0}
.recibo-doc .val{white-space:nowrap; font-variant-numeric:tabular-nums}

@media print{
  html,body{background:#fff !important; margin:0; padding:0}
  .side,.head,.toast,.noprint,.modal,.semEstoque,.printhide{display:none !important}
  .main{padding:0 !important}
  .app{display:block !important; min-height:0 !important}

  /* cupom: só ele na folha */
  body.imp-recibo #view{display:none !important}
  body.imp-recibo #recibo{display:block !important}

  /* relatórios: a tela, sem o cupom */
  body:not(.imp-recibo) #recibo{display:none !important}
  body:not(.imp-recibo) .card{break-inside:avoid; box-shadow:none}
  body:not(.imp-recibo) table{font-size:9pt}
}

</style>
</head>
<body>

<div class="app">
  <!-- ============ MENU ============ -->
  <aside class="side">
    <div class="top">
      <div class="logo">
        <svg class="tatu" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <ellipse cx="27" cy="36" rx="22" ry="21" fill="#E8842C" stroke="#8C4A10" stroke-width="2.2"/>
          <path d="M13 20c10-6 24-4 30 6" stroke="#8C4A10" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M7 30c12-8 28-6 36 4" stroke="#8C4A10" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M6 42c12-6 28-5 37 4" stroke="#8C4A10" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M44 18c6 2 12 9 12 17 0 9-7 15-13 15-4 0-6-3-4-6 3-5 4-9 3-14-1-5-3-9-1-11 1-1 2-1 3-1z" fill="#F6A85F" stroke="#8C4A10" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M45 12c3-4 8-5 9-2 1 3-2 7-5 9z" fill="#F6A85F" stroke="#8C4A10" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M47 33c2 0 3 1 3 2" stroke="#8C4A10" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="21" cy="32" r="1.7" fill="#8C4A10"/><circle cx="30" cy="27" r="1.7" fill="#8C4A10"/>
          <circle cx="17" cy="45" r="1.7" fill="#8C4A10"/><circle cx="31" cy="46" r="1.7" fill="#8C4A10"/>
        </svg>
        <div class="wm">
          <span class="kava">Kava</span>
          <span class="kids"><i>K</i><i>I</i><i>D</i><i>S</i></span>
        </div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="footInfo">—</div>
      <div style="margin-top:4px">Dados salvos neste computador</div>
    </div>
  </aside>

  <!-- ============ CONTEÚDO ============ -->
  <main class="main">
    <div class="head">
      <div><h1 id="tTitulo">—</h1><p id="tSub"></p></div>
      <div id="tAcoes" class="row" style="align-items:center"></div>
    </div>
    <div id="view"></div>
    <div id="recibo"></div>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* =======================================================================
   KAVA KIDS — Sistema de Vendas e Gestão
   Aplicativo local (roda no navegador, sem internet). Dados no navegador.
   ======================================================================= */

/* ---------- 1. BANCO DE DADOS ---------- */
const VERSAO = "2.2 — 29/08/2026";
const CHAVE = "kavakids_db_v1";
const VAZIO = { produtos:[], clientes:[], vendas:[], movimentos:[], seqVenda:1,
                config:{ loja:"Kava Kids", estoqueMinimo:2, cupom:"80mm" } };
let DB = carregar();

function carregar(){
  try{
    const raw = localStorage.getItem(CHAVE);
    if(!raw) return structuredClone(VAZIO);
    const d = JSON.parse(raw);
    return Object.assign(structuredClone(VAZIO), d);
  }catch(e){ console.error(e); return structuredClone(VAZIO); }
}
let armazenamentoOk = true;
function salvar(){

/* =====================================================================
   LEITOR DE CÓDIGO DE BARRAS
   O leitor USB se comporta como teclado. Se o foco não estiver no campo
   certo na hora do disparo, os caracteres se perdem e o código chega
   picotado. Por isso a tela que tem leitor registra o campo aqui, e todo
   caractere digitado fora de um campo é desviado para ele.
   ===================================================================== */
let leitorAtivo = null;   // {campo, aoLer} da tela atual
let ultimaTecla = 0;      // para separar uma bipada da outra

/** Sobra de uma leitura interrompida não pode grudar na leitura seguinte. */
function novaRajada(){
  const agora = Date.now();
  const gap = agora - ultimaTecla;
  ultimaTecla = agora;
  // leitor dispara os caracteres em milissegundos; pausa longa = leitura nova
  if(gap > 800 && leitorAtivo && leitorAtivo.campo.value) leitorAtivo.campo.value = "";
}

function registrarLeitor(id, aoLer){
  const campo = $("#"+id);
  if(!campo) return;
  leitorAtivo = {campo, aoLer};
  campo.value = "";
  campo.focus();
  campo.addEventListener("keydown", e => {
    if(e.key === "Escape"){ campo.value = ""; return; }
    if(e.key.length === 1) novaRajada();
    if(e.key !== "Enter") return;
    e.preventDefault();
    dispararLeitura();
  });
}

function focarLeitor(){
  if(leitorAtivo && document.body.contains(leitorAtivo.campo) && $("#modal").hidden)
    setTimeout(()=>{ try{ leitorAtivo.campo.focus(); }catch(e){} }, 0);
}

function dispararLeitura(){
  if(!leitorAtivo) return;
  const cod = leitorAtivo.campo.value.trim();
  leitorAtivo.campo.value = "";
  if(cod) leitorAtivo.aoLer(cod);
}

/** Nenhum caractere se perde: o que for digitado fora de um campo entra no leitor. */
document.addEventListener("keydown", e => {
  if(e.altKey || e.ctrlKey || e.metaKey) return;
  if(!leitorAtivo || !$("#modal").hidden) return;
  if(!document.body.contains(leitorAtivo.campo)){ leitorAtivo = null; return; }
  const alvo = e.target;
  if(alvo && typeof alvo.matches === "function" &&
     alvo.matches("input,select,textarea,[contenteditable]")) return;
  if(e.key === "Enter"){ e.preventDefault(); dispararLeitura(); }
  else if(e.key.length === 1){
    e.preventDefault();
    novaRajada();
    leitorAtivo.campo.value += e.key;      // guarda o caractere antes de mover o foco
    leitorAtivo.campo.focus();
    const n = leitorAtivo.campo.value.length;
    try{ leitorAtivo.campo.setSelectionRange(n,n); }catch(err){}
  }
}, true);
$("#modal").addEventListener("mousedown", e => { if(e.target.id==="modal") fechar(); });
document.addEventListener("keydown", e => { if(e.key==="Escape" && !$("#modal").hidden) fechar(); });

function confirmar(titulo, texto, aoConfirmar, rotulo="Confirmar"){
  window.__conf = () => { fechar(); aoConfirmar(); };
  modal(titulo, `<p style="margin:0">${texto}</p>`,
    `<button class="btn sec" onclick="fechar()">Voltar</button>
     <button class="btn dan" onclick="__conf()">${esc(rotulo)}</button>`);
}

const produto     = id  => DB.produtos.find(p=>p.id===id);
/** Só dígitos/letras: o leitor às vezes manda espaço, tab ou caractere de controle. */
const limpaCodigo = c => String(c ?? "").replace(/[^0-9A-Za-z]/g, "").toUpperCase();

/**
 * Localiza pelo código de barras sem implicar com detalhe de digitação:
 * compara ignorando espaços, pontuação, maiúsculas e zeros à esquerda.
 */
function porCodigo(cod){
  const alvo = limpaCodigo(cod);
  if(!alvo) return undefined;
  const vivos = DB.produtos.filter(p=>p.ativo!==false);
  return vivos.find(p => limpaCodigo(p.codigo) === alvo)
      || vivos.find(p => limpaCodigo(p.codigo).replace(/^0+/,"") === alvo.replace(/^0+/,""));
}

/** Peça EXCLUÍDA com este código. Fica fora da lista, mas o código segue ocupado. */
function excluidoPorCodigo(cod){
  const alvo = limpaCodigo(cod);
  if(!alvo) return undefined;
  return DB.produtos.find(p => p.ativo===false && limpaCodigo(p.codigo) === alvo);
}

/** Devolve uma peça excluída ao cadastro, preservando o histórico dela. */

const soDigitos = v => String(v??"").replace(/\D/g,"");

/** Formata CPF enquanto o usuário digita: 000.000.000-00 */
const cpfFmt = v => soDigitos(v).slice(0,11)
  .replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");

/** Valida CPF pelos dois dígitos verificadores. */
function cpfValido(v){
  const s = soDigitos(v);
  if(s.length !== 11 || /^(\d)\1{10}$/.test(s)) return false;
  for(const [ate, pos] of [[9,9],[10,10]]){
    let soma = 0;
    for(let i=0;i<ate;i++) soma += (+s[i]) * (ate+1-i);
    let d = (soma*10) % 11; if(d===10) d = 0;
    if(d !== +s[pos]) return false;
  }
  return true;
}

/** Tira o código do país quando o número foi digitado ou colado com +55. */
function semDDI(v){
  let s = soDigitos(v);
  if(s.startsWith("0055")) s = s.slice(4);
  else if(s.length > 11 && s.startsWith("55")) s = s.slice(2);   // 5511988124471 -> 11988124471
  if(s.length > 11 && s.startsWith("0")) s = s.slice(1);         // 0 de operadora
  return s.slice(0,11);
}

/** Formata telefone: (11) 91234-5678 ou (11) 1234-5678 */
const telFmt = v => {
  const s = semDDI(v);
  if(s.length<=2)  return s;
  if(s.length<=6)  return `(${s.slice(0,2)}) ${s.slice(2)}`;
  if(s.length<=10) return `(${s.slice(0,2)}) ${s.slice(2,6)}-${s.slice(6)}`;
  return `(${s.slice(0,2)}) ${s.slice(2,7)}-${s.slice(7)}`;
};

/** Número no formato que o WhatsApp exige: 55 + DDD + número. null se incompleto. */
function zapNumero(tel){
  const s = semDDI(tel);
  return (s.length === 10 || s.length === 11) ? "55" + s : null;
}

/** Link wa.me pronto, com mensagem opcional. */
function zapLink(tel, msg){
  const n = zapNumero(tel);
  return n ? `https://wa.me/${n}${msg?`?text=${encodeURIComponent(msg)}`:""}` : null;
}

/** Próximo aniversário a partir de hoje: em quantos dias, e que idade completa. */
function proxAniv(nascimento, ref = new Date()){
  if(!nascimento) return null;
  const [a,m,d] = nascimento.slice(0,10).split("-").map(Number);
  if(!a || !m || !d) return null;
  const hoje0 = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
  const montar = ano => {
    const x = new Date(ano, m-1, d);
    return x.getMonth() === m-1 ? x : new Date(ano, m, 0);   // 29/02 em ano comum -> 28/02
  };
  let alvo = montar(hoje0.getFullYear());
  if(alvo < hoje0) alvo = montar(hoje0.getFullYear()+1);
  return { data: alvo, iso: isoLocal(alvo), dias: Math.round((alvo-hoje0)/864e5),
           idade: alvo.getFullYear() - a, nascimento };
}

/** Aniversários (comprador e crianças) nos próximos N dias. */
function aniversarios(dentroDe = 7){
  const out = [];
  for(const c of DB.clientes.filter(c=>c.ativo!==false)){
    const b = proxAniv(c.nascimento);
    if(b && b.dias <= dentroDe) out.push({cliente:c, quem:c.nome, tipo:"Comprador", ...b});
    for(const k of c.criancas||[]){
      const kb = proxAniv(k.nascimento);
      if(kb && kb.dias <= dentroDe) out.push({cliente:c, quem:k.nome||"Criança", tipo:"Criança", ...kb});
    }
  }
  return out.sort((a,b)=> a.dias - b.dias || a.quem.localeCompare(b.quem));
}

function movimentar(produtoId, motivo, qtd, opts={}){
  const p = produto(produtoId); if(!p) return null;
  const m = MOTIVOS[motivo];
  const delta = (m.t==="entrada" ? 1 : -1) * Math.abs(qtd);
  p.estoque = (p.estoque||0) + delta;
  const mov = {
    id: uid(), produtoId, codigo:p.codigo, motivo, tipo:m.t,
    qtd: Math.abs(qtd), delta, custoUnit: opts.custo ?? p.custo ?? 0,
    data: opts.data || new Date().toISOString(), obs: opts.obs || "",
    vendaId: opts.vendaId || null, saldo: p.estoque
  };
  DB.movimentos.push(mov);
  return mov;
}

/**
 * Verifica se ainda dá para tirar `qtd` peças do estoque, considerando o que já
 * está no carrinho/troca em andamento. Devolve null quando pode; senão o motivo.
 */
function conferirEstoque(p, qtd, jaReservado){
  const disp = p.estoque || 0;
  if(disp <= 0)                    return {motivo:"sem",   disp, desc:descProduto(p), codigo:p.codigo};
  if(jaReservado + qtd > disp)     return {motivo:"insuf", disp, desc:descProduto(p), codigo:p.codigo, jaReservado};
  return null;
}

/* Períodos ------------------------------------------------------------- */
function segunda(d){ const x=new Date(d); const w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); return x; }
function isoLocal(d){ return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

function periodo(chave){
  const h = new Date(); const f = isoLocal(h);
  const menos = n => { const d=new Date(h); d.setDate(d.getDate()-n); return isoLocal(d); };
  switch(chave){
    case "hoje":     return {de:f, ate:f, nome:"Hoje"};
    case "ontem":    return {de:menos(1), ate:menos(1), nome:"Ontem"};
    case "7dias":    return {de:menos(6), ate:f, nome:"Últimos 7 dias"};
    case "semana":   return {de:isoLocal(segunda(h)), ate:f, nome:"Esta semana"};
    case "30dias":   return {de:menos(29), ate:f, nome:"Últimos 30 dias"};
    case "mes":      return {de:f.slice(0,8)+"01", ate:f, nome:"Este mês"};
    case "mespass":{ const d=new Date(h.getFullYear(),h.getMonth()-1,1), u=new Date(h.getFullYear(),h.getMonth(),0);
                     return {de:isoLocal(d), ate:isoLocal(u), nome:"Mês passado"}; }
    case "ano":      return {de:f.slice(0,4)+"-01-01", ate:f, nome:"Este ano"};
    case "anopass":{ const a=h.getFullYear()-1; return {de:a+"-01-01", ate:a+"-12-31", nome:"Ano passado"}; }
    default:         return {de:menos(29), ate:f, nome:"Últimos 30 dias"};
  }
}

/** Vendas válidas (não canceladas) dentro do período. */
function vendasNo(de, ate){
  return DB.vendas.filter(v => !v.cancelada && diaDe(v.data) >= de && diaDe(v.data) <= ate)
                  .sort((a,b)=> a.data < b.data ? 1 : -1);
}

/** Consolida receita, custo (CMV), lucro, margem e markup de um conjunto de vendas. */
function resumo(vendas){
  let receita=0, custo=0, desconto=0, pecas=0, devolvidas=0, trocas=0;
  for(const v of vendas){
    if(v.tipo==="troca") trocas++;
    receita += v.total; desconto += v.desconto||0;
    for(const i of v.itens){
      custo += i.custo * i.qtd;
      if(i.qtd>0) pecas += i.qtd; else devolvidas += -i.qtd;
    }
  }
  const lucro = receita - custo;
  return {
    receita, custo, lucro, desconto, pecas, devolvidas, trocas,
    vendas: vendas.length,
    margem: receita ? lucro/receita : NaN,     // lucro sobre a venda
    markup: custo   ? lucro/custo   : NaN,     // lucro sobre o custo
    ticket: vendas.length ? receita/vendas.length : 0
  };
}

  if(!armazenamentoOk){
    grave = true;
    txt = `<b>Este navegador não está salvando os dados.</b> Tudo será perdido ao fechar a página.
           Baixe um backup e abra o arquivo em outro navegador (Chrome ou Edge).`;
  }else if(d !== null && d >= 7){
    txt = `<b>Backup atrasado.</b> ${d===999?"Você ainda não baixou nenhum backup.":`Último backup há ${d} dias.`}
           Os dados ficam só neste computador — baixe uma cópia agora.`;

  if(!txt) return;
  const el = document.createElement("div");
  el.id = "faixa"; el.className = "noprint";

}

/* --- Venda/troca em andamento guardada no navegador -------------------
   Assim nada se perde se a página for fechada, recarregada por engano,
   ou se algo interromper a operação no meio.                          */
const CHAVE_TMP = "kavakids_emandamento_v1";
const PAGAMENTOS = ["Dinheiro","PIX","Débito","Crédito","Crédito parcelado","Troca / crédito"];

function salvarEmAndamento(){
  try{
    localStorage.setItem(CHAVE_TMP, JSON.stringify({
      carrinho, carrinhoDesconto, carrinhoPag, carrinhoObs, vendaCliente, troca }));
  }catch(e){ /* sem armazenamento: a faixa vermelha já avisa */ }
}
function limparEmAndamento(){ try{ localStorage.removeItem(CHAVE_TMP); }catch(e){} }

function carregarEmAndamento(){
  try{
    const d = JSON.parse(localStorage.getItem(CHAVE_TMP) || "null");
    if(!d) return 0;
    if(Array.isArray(d.carrinho)) carrinho = d.carrinho.filter(i=>produto(i.produtoId));
    carrinhoDesconto = d.carrinhoDesconto || "";
    carrinhoPag = PAGAMENTOS.includes(d.carrinhoPag) ? d.carrinhoPag : "Dinheiro";
    carrinhoObs = d.carrinhoObs || "";
    vendaCliente = (d.vendaCliente && cliente(d.vendaCliente)) ? d.vendaCliente : null;
    if(d.troca && Array.isArray(d.troca.entradas) && Array.isArray(d.troca.saidas)){
      troca = Object.assign({modo:"entrada", entradas:[], saidas:[], desconto:"", cliente:null, pag:"", obs:""}, d.troca);
      troca.entradas = troca.entradas.filter(i=>produto(i.produtoId));
      troca.saidas   = troca.saidas.filter(i=>produto(i.produtoId));
      if(troca.cliente && !cliente(troca.cliente)) troca.cliente = null;
    }
    return carrinho.length + troca.entradas.length + troca.saidas.length;
  }catch(e){ return 0; }
}

function lerNoPDV(cod){

    alertaPDV = {motivo:"excluido", codigo:String(cod), produtoId:morto.id, desc:descProduto(morto)};
    aviso("Esta peça foi excluída do cadastro.","err");
    telaPDV(); return;
  }
  const p = porCodigo(cod);
  if(!p){
    // Não troca de tela: mostra o código lido, para dar para conferir na hora
    // se o leitor mandou o número certo.
    alertaPDV = {motivo:"naoCadastrado", codigo:String(cod)};
    aviso("Código não encontrado no cadastro.","err");
    telaPDV(); return;
  }
  alertaPDV = null;
  addCarrinho(p, 1);
}

/**
 * Compara o código lido com os cadastrados e diz o que aconteceu.
 * "termina" = a leitura perdeu o começo; "comeca" = perdeu o fim.
 */
function codigosParecidos(cod){
  const alvo = limpaCodigo(cod);
  if(alvo.length < 3) return [];
  const achados = [];
  for(const p of DB.produtos.filter(x=>x.ativo!==false)){
    const c = limpaCodigo(p.codigo);
    if(!c || c === alvo) continue;
    let tipo = null;
    if(c.endsWith(alvo))        tipo = "termina";        // faltou o começo
    else if(c.startsWith(alvo)) tipo = "comeca";         // faltou o fim
    else if(c.includes(alvo))   tipo = "meio";
    else if(alvo.endsWith(c) || alvo.startsWith(c)) tipo = "sobrou";
    if(tipo) achados.push({p, tipo, c, faltam: Math.abs(c.length - alvo.length)});
  }
  const ordem = {termina:0, comeca:1, meio:2, sobrou:3};
  return achados.sort((a,b)=>ordem[a.tipo]-ordem[b.tipo] || a.faltam-b.faltam).slice(0,4);
}

const DIAGNOSTICO = {
  termina: "a leitura perdeu o COMEÇO do código",
  comeca:  "a leitura perdeu o FIM do código",
  meio:    "a leitura pegou só um pedaço do meio",
  sobrou:  "a leitura veio com caracteres a mais"

/** Reativa a peça excluída e já a coloca na operação em andamento. */
function reativarELer(id){

/** Abre o cadastro já com o código que o leitor mandou. */
function cadastrarLido(cod){
  alertaPDV = null; alertaTroca = null;
  irPara("produtos");
  setTimeout(()=>formProduto(null, cod), 60);
}

function addCarrinho(p, qtd){
  if(qtd > 0){
    const ja = carrinho.filter(i=>i.produtoId===p.id).reduce((s,i)=>s+Math.max(0,i.qtd),0);
    const erro = conferirEstoque(p, qtd, ja);
    if(erro){                                   // sem estoque: a venda não é permitida
      alertaPDV = erro;
      aviso(`SEM ESTOQUE — ${descProduto(p)}`,"err");
      telaPDV(); return;
    }
  }
  alertaPDV = null;
  const ix = carrinho.findIndex(i => i.produtoId===p.id && Math.sign(i.qtd)===Math.sign(qtd));
  if(ix>=0) carrinho[ix].qtd += qtd;
  else carrinho.push({ produtoId:p.id, codigo:p.codigo, desc:descProduto(p), qtd, preco:p.preco||0, custo:p.custo||0 });
  telaPDV();
}
function mudarQtd(ix,d){
  const i = carrinho[ix];
  if(d > 0 && i.qtd > 0){                       // aumentar quantidade também respeita o estoque
    const p = produto(i.produtoId);
    const ja = carrinho.filter(x=>x.produtoId===i.produtoId).reduce((s,x)=>s+Math.max(0,x.qtd),0);
    const erro = p && conferirEstoque(p, d, ja);
    if(erro){ alertaPDV = erro; aviso(`SEM ESTOQUE — ${erro.desc}`,"err"); telaPDV(); return; }
  }
  i.qtd += d;
  if(i.qtd===0) carrinho.splice(ix,1);
  telaPDV();
}
function mudarPreco(ix,v){ carrinho[ix].preco = numero(v); telaPDV(); }
function removerItem(ix){ carrinho.splice(ix,1); telaPDV(); }
function limparCarrinho(){
  carrinho=[]; carrinhoDesconto=""; carrinhoPag="Dinheiro"; carrinhoObs="";
  vendaCliente=null; alertaPDV=null;
  salvarEmAndamento(); telaPDV();
}

/** Cancela a venda em andamento. Confirma antes, para não perder o que já foi bipado. */
function cancelarVenda(){
  if(!carrinho.length) return;
  const n = carrinho.reduce((s,i)=>s+Math.abs(i.qtd),0);
  confirmar("Cancelar venda",
    `Descartar esta venda com <b>${n} peça(s)</b>?<br><br>Nada foi gravado ainda — o estoque não muda.
     Se você só quis fechar a janela de impressão, clique em Voltar.`,
    ()=>{ limparCarrinho(); aviso("Venda cancelada.","ok"); }, "Descartar venda");
}

/** Vincula (ou troca) o cliente de uma venda já concluída. */
function vincularCliente(vendaId, reabrir){
  const v = DB.vendas.find(x=>x.id===vendaId); if(!v) return;
  escolherCliente(id => {
    v.clienteId = id;
    salvar(); render();
    aviso(`Venda #${v.numero} vinculada a ${cliente(id).nome}.`,"ok");
    if(reabrir) verVenda(vendaId);
  }, `Vincular a venda #${v.numero} a um cliente`);
}
function desvincularCliente(vendaId, reabrir){
  const v = DB.vendas.find(x=>x.id===vendaId); if(!v) return;
  v.clienteId = null; salvar(); render();
  aviso("Cliente desvinculado da venda.","ok");
  if(reabrir) verVenda(vendaId);
}

/** Busca de produto reutilizada por PDV, devolução e estoque. */
function buscarProduto(destino){
  const lista = DB.produtos.filter(p=>p.ativo!==false);
  window.__pick = id => {
    const p = produto(id); fechar();
    if(destino==="pdv") addCarrinho(p, 1);
    else if(destino==="troca") addTroca(p, 1);
    else if(destino==="mov") formMovimento(id);
  };
  window.__filtrar = q => {
    q = q.toLowerCase().trim();
    // bipou o código inteiro dentro da busca: seleciona a peça na hora
    if(q.length >= 6){
      const exato = porCodigo(q);
      if(exato && exato.ativo!==false){ __pick(exato.id); return; }
    }
    const r = lista.filter(p => !q || (p.codigo+" "+descProduto(p)+" "+(p.genero||"")).toLowerCase().includes(q)).slice(0,60);
    $("#bpRes").innerHTML = r.length ? r.map(p=>`
      <tr style="cursor:pointer${(p.estoque||0)<=0?";opacity:.55":""}" onclick="__pick('${p.id}')">
        <td class="mono" style="font-size:12.5px">${esc(p.codigo)}</td>
        <td>${esc(descProduto(p))}</td>
        <td>${tagGenero(p.genero)}</td>
        <td class="num">${(p.estoque||0)<=0 ? `<span class="tag s">sem estoque</span>` : p.estoque}</td>
        <td class="num">${brl(p.preco)}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="vazio">Nada encontrado</td></tr>`;
  };
  modal(destino==="troca" ? `Buscar peça — ${troca.modo==="entrada"?"ENTRADA (devolvida)":"SAÍDA (levada)"}` : "Buscar produto",
   `<input id="bpQ" placeholder="Marca, modelo, cor, tamanho ou código…" oninput="__filtrar(this.value)" autocomplete="off">
    ${destino==="troca"?`<p class="hint" style="margin:10px 0 0">${troca.modo==="entrada"?"A peça volta ao estoque e vira crédito para o cliente.":"A peça sai do estoque e conta como venda."}</p>`:""}
    <div class="tw" style="max-height:420px;overflow:auto;margin-top:12px">
      <table><thead><tr><th>Código</th><th>Peça</th><th>Gênero</th><th class="num">Est.</th><th class="num">Preço</th></tr></thead>
      <tbody id="bpRes"></tbody></table></div>`, "", true);
  __filtrar("");
  setTimeout(()=>$("#bpQ").focus(),50);
}

/** Última conferência antes de gravar: nenhuma peça pode sair além do estoque. */
function conferirCarrinho(itens){
  const soma = new Map();
  for(const i of itens) if(i.qtd > 0) soma.set(i.produtoId, (soma.get(i.produtoId)||0) + i.qtd);
  for(const [pid, qtd] of soma){
    const p = produto(pid); if(!p) continue;
    const erro = conferirEstoque(p, qtd, 0);
    if(erro) return erro;
  }
  return null;
}

/**
 * Grava uma transação (venda ou troca) e movimenta o estoque.
 * Itens com qtd positiva saem do estoque (venda); com qtd negativa voltam (devolução).
 * Usado tanto pelo PDV quanto pelo módulo de Troca.
 */
function registrarVenda({itens, desconto=0, pagamento, obs="", clienteId=null, tipo="venda"}){
  const sub = itens.reduce((s,i)=>s+i.preco*i.qtd,0);
  const cus = itens.reduce((s,i)=>s+i.custo*i.qtd,0);
  const tot = sub - desconto;
  const v = {
    id: uid(), numero: DB.seqVenda++, data: new Date().toISOString(),
    itens: itens.map(i=>({...i})),
    subtotal: sub, desconto, total: tot, custo: cus, lucro: tot-cus,
    pagamento, obs, clienteId, tipo, cancelada:false
  };
  DB.vendas.push(v);
  const rotulo = tipo==="troca" ? "troca" : "venda";
  for(const i of v.itens){
    if(i.qtd>0) movimentar(i.produtoId,"venda",        i.qtd, {vendaId:v.id, custo:i.custo,
                             obs: tipo==="troca" ? `Peça levada na troca #${v.numero}` : ""});
    else        movimentar(i.produtoId,"troca_entrada",-i.qtd,{vendaId:v.id, custo:i.custo,
                             obs:`Peça devolvida na ${rotulo} #${v.numero}`});
  }
  salvar();
  return v;
}

function finalizarVenda(){
  if(!carrinho.length) return;
  const falta = conferirCarrinho(carrinho);
  if(falta){ alertaPDV = falta; aviso(`SEM ESTOQUE — ${falta.desc}`,"err"); telaPDV(); return; }
  const v = registrarVenda({
    itens: carrinho, desconto: numero(carrinhoDesconto),
    pagamento: carrinhoPag, obs: carrinhoObs.trim(),
    clienteId: vendaCliente, tipo:"venda"
  });
  limparCarrinho();
  aviso(`Venda #${v.numero} registrada — ${brl(v.total)}`,"ok");
  verVenda(v.id);
}

/** Crédito da peça devolvida: o que o cliente realmente pagou, se der para saber. */
function ultimoPrecoPago(clienteId, produtoId){
  if(!clienteId) return null;
  for(const v of comprasDe(clienteId)){             // já vem da mais recente
    const it = v.itens.find(i=>i.produtoId===produtoId && i.qtd>0);
    if(it) return it.preco;
  }
  return null;
}

function htmlListaTroca(qual){

    <th>Código</th><th>Peça</th><th class="num">Qtd</th><th class="num">${ent?"Crédito unit.":"Valor unit."}</th>
    <th class="num">Total</th><th></th>
  </tr></thead><tbody>` + lista.map((i,ix)=>{
    const p = produto(i.produtoId);
    const dif = p && Math.abs(i.preco - (p.preco||0)) > 0.005;
    return `<tr>
      <td class="mono" style="font-size:12.5px">${esc(i.codigo)}</td>

      <td class="num">

}

function htmlClienteTroca(){
  const c = troca.cliente ? cliente(troca.cliente) : null;
  if(!c) return `
    <div class="row" style="align-items:center;justify-content:space-between;gap:8px">
      <span class="hint"><b>Cliente</b><br>Selecione para creditar o preço que ela pagou</span>

function selecionarClienteTroca(){
  escolherCliente(id => { troca.cliente = id; telaTroca(); }, "Cliente da troca");
}

function lerNaTroca(cod){
  const morto = !porCodigo(cod) && excluidoPorCodigo(cod);
  if(morto){
    alertaTroca = {motivo:"excluido", codigo:String(cod), produtoId:morto.id, desc:descProduto(morto)};
    aviso("Esta peça foi excluída do cadastro.","err");
    telaTroca(); return;
  }
  const p = porCodigo(cod);
  if(!p){
    alertaTroca = {motivo:"naoCadastrado", codigo:String(cod)};
    aviso("Código não encontrado no cadastro.","err");
    telaTroca(); return;
  }
  alertaTroca = null;
  addTroca(p, 1);
}

function addTroca(p, qtd){
  const qual = troca.modo==="entrada" ? "entradas" : "saidas";
  const lista = troca[qual];
  if(qual === "saidas"){                        // peça levada sai do estoque: precisa existir
    const ja = lista.filter(i=>i.produtoId===p.id).reduce((s,i)=>s+i.qtd,0);
    const erro = conferirEstoque(p, qtd, ja);
    if(erro){
      alertaTroca = erro;
      aviso(`SEM ESTOQUE — ${descProduto(p)}`,"err");
      telaTroca(); return;
    }
  }
  alertaTroca = null;
  const ix = lista.findIndex(i=>i.produtoId===p.id);
  if(ix>=0) lista[ix].qtd += qtd;
  else{
    const pago = troca.modo==="entrada" ? ultimoPrecoPago(troca.cliente, p.id) : null;
    lista.push({ produtoId:p.id, codigo:p.codigo, desc:descProduto(p), qtd,
                 preco: pago ?? (p.preco||0), custo:p.custo||0 });
    if(pago !== null && Math.abs(pago-(p.preco||0)) > 0.005)
      aviso(`Crédito de ${brl(pago)} — foi o que ${cliente(troca.cliente).nome.split(" ")[0]} pagou.`);
  }
  telaTroca();
}
function qtdTroca(qual, ix, d){
  salvarEmAndamento();
  const l = troca[qual];
  if(qual==="saidas" && d > 0){
    const p = produto(l[ix].produtoId);
    const ja = l.filter(x=>x.produtoId===l[ix].produtoId).reduce((s,x)=>s+x.qtd,0);
    const erro = p && conferirEstoque(p, d, ja);
    if(erro){ alertaTroca = erro; aviso(`SEM ESTOQUE — ${erro.desc}`,"err"); telaTroca(); return; }
  }
  l[ix].qtd += d;
  if(l[ix].qtd <= 0) l.splice(ix,1);
  telaTroca();
}
function precoTroca(qual, ix, v){ troca[qual][ix].preco = numero(v); telaTroca(); }
function delTroca(qual, ix){ troca[qual].splice(ix,1); telaTroca(); }
function limparTroca(){
  troca = {modo:"entrada", entradas:[], saidas:[], desconto:"", cliente:null, pag:"", obs:""};
  alertaTroca=null; salvarEmAndamento(); telaTroca();
}

/** Cancela a troca em andamento, confirmando antes. */
function cancelarTroca(){
  const n = troca.entradas.reduce((s,i)=>s+i.qtd,0) + troca.saidas.reduce((s,i)=>s+i.qtd,0);
  if(!n) return;
  confirmar("Cancelar troca",
    `Descartar esta troca com <b>${n} peça(s)</b>?<br><br>Nada foi gravado ainda — o estoque não muda.
     Se você só quis fechar a janela de impressão, clique em Voltar.`,
    ()=>{ limparTroca(); aviso("Troca cancelada.","ok"); }, "Descartar troca");
}

function finalizarTroca(){
  if(!troca.entradas.length && !troca.saidas.length) return;
  const falta = conferirCarrinho(troca.saidas);
  if(falta){ alertaTroca = falta; aviso(`SEM ESTOQUE — ${falta.desc}`,"err"); telaTroca(); return; }
  // entradas viram quantidade negativa: devolvem estoque e abatem do total
  const itens = [
    ...troca.saidas.map(i=>({...i})),
    ...troca.entradas.map(i=>({...i, qtd:-i.qtd}))
  ];
  const v = registrarVenda({
    itens, desconto: numero(troca.desconto),
    pagamento: $("#trocaPag")?.value || troca.pag || "Dinheiro", obs: (troca.obs||"").trim(),
    clienteId: troca.cliente, tipo:"troca"
  });
  limparTroca();
  aviso(v.total >= 0
    ? `Troca #${v.numero} registrada — cliente pagou ${brl(v.total)}`
    : `Troca #${v.numero} registrada — crédito de ${brl(-v.total)} ao cliente`, "ok");
  verVenda(v.id);
}

function produtosFiltrados(){
  const q = filtroProd.q.toLowerCase().trim();
  const min = DB.config.estoqueMinimo||0;
  return DB.produtos.filter(p=>{
    if(filtroProd.excluidos ? p.ativo!==false : p.ativo===false) return false;
    if(q && !(p.codigo+" "+descProduto(p)).toLowerCase().includes(q)) return false;
    if(filtroProd.genero  && p.genero  !== filtroProd.genero)  return false;
    if(filtroProd.tamanho && p.tamanho !== filtroProd.tamanho) return false;
    if(filtroProd.marca   && p.marca   !== filtroProd.marca)   return false;
    if(filtroProd.estoque==="baixo" && (p.estoque||0) > min)   return false;
    if(filtroProd.estoque==="zero"  && (p.estoque||0) > 0)     return false;
    return true;
  }).sort((a,b)=> (a.marca||"").localeCompare(b.marca||"") || (a.modelo||"").localeCompare(b.modelo||""));
}

function listaProdutos(){
  const l = produtosFiltrados(); const min = DB.config.estoqueMinimo||0;
  const ativos = DB.produtos.filter(p=>p.ativo!==false).length;
  const filtrando = !!(filtroProd.q || filtroProd.genero || filtroProd.tamanho ||
                       filtroProd.marca || filtroProd.estoque);
  $("#lp").innerHTML = !l.length
    ? ( filtrando && ativos
        ? `<div class="vazio"><b>Nenhuma peça com esses filtros</b>
             Há <b>${ativos}</b> produto(s) cadastrado(s), escondidos pela busca ou pelos filtros acima.
             <div style="margin-top:12px"><button class="btn" onclick="limparFiltrosProd()">Limpar filtros e ver tudo</button></div>
           </div>`
        : `<div class="vazio"><b>${filtroProd.excluidos?"Nenhuma peça excluída":"Nenhum produto"}</b>${
            filtroProd.excluidos ? "Tudo que foi excluído aparece aqui."
                                 : "Passe um código de barras acima para cadastrar a primeira peça."}</div>` )
    : `<div class="tw"><table><thead><tr>
        <th>Código</th><th>Marca</th><th>Modelo</th><th>Tam.</th><th>Cor</th><th>Gênero</th>
        <th class="num">Custo</th><th class="num">Venda</th><th class="num">Markup</th><th class="num">Estoque</th><th></th>
      </tr></thead><tbody>` + l.map(p=>{
        const mk = markup(p);
        return `<tr>
          <td class="mono" style="font-size:12.5px">${esc(p.codigo)}</td>
          <td><b>${esc(p.marca)}</b></td><td>${esc(p.modelo)}</td>
          <td><span class="tag">${esc(p.tamanho)}</span></td><td>${esc(p.cor)}</td><td>${tagGenero(p.genero)}</td>
          <td class="num">${brl(p.custo)}</td><td class="num"><b>${brl(p.preco)}</b></td>
          <td class="num ${mk!==null&&mk<0?"neg":"pos"}">${mk===null?"—":pct(mk)}</td>
          <td class="num">${ (p.estoque||0) <= 0 ? `<span class="tag s">sem estoque</span>`
             : (p.estoque||0) <= min ? `<span class="tag al">${p.estoque}</span>` : `<b>${p.estoque}</b>` }</td>
          <td class="num" style="white-space:nowrap">
            ${ p.ativo===false
              ? `<button class="btn sm" onclick="restaurarProduto('${p.id}')">Restaurar</button>`
              : `<button class="btn gh sm" onclick="fichaProduto('${p.id}')" title="Ficha">Ficha</button>
                 <button class="btn gh sm" onclick="formProduto('${p.id}')" title="Editar">✎</button>
                 <button class="btn gh sm" onclick="excluirProduto('${p.id}')" title="Excluir">🗑</button>` }
          </td></tr>`;
      }).join("") + `</tbody></table></div>`;
}

/** Zera busca e filtros da tela de Produtos. */
function limparFiltrosProd(){
  filtroProd = {q:"", genero:"", tamanho:"", marca:"", estoque:"", excluidos:false};
  telaProdutos();
}

function formProduto(id, codigo){
  const p = id ? produto(id) : null;
  const marcas = [...new Set(DB.produtos.map(x=>x.marca).filter(Boolean))].sort();
  const cores  = [...new Set(DB.produtos.map(x=>x.cor).filter(Boolean))].sort();
  modal(p ? "Editar produto" : "Novo produto", `
    <datalist id="dlMarcas">${marcas.map(m=>`<option value="${esc(m)}">`).join("")}</datalist>
    <datalist id="dlCores">${cores.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="row">
      <label class="f" style="flex:1 1 100%">Código de barras *
        <input id="fCod" value="${esc(p?p.codigo:(codigo||""))}" placeholder="Passe o leitor ou digite" autocomplete="off">
      </label>
      <label class="f">Marca *   <input id="fMarca"  list="dlMarcas" value="${esc(p?.marca||"")}" placeholder="Ex.: Milon"></label>
      <label class="f">Modelo *  <input id="fModelo" value="${esc(p?.modelo||"")}" placeholder="Ex.: Conjunto manga longa"></label>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="f">Tamanho *
        <select id="fTam">${TAMANHOS.map(t=>`<option ${p?.tamanho===t?"selected":""}>${t}</option>`).join("")}</select>
      </label>
      <label class="f">Cor * <input id="fCor" list="dlCores" value="${esc(p?.cor||"")}" placeholder="Ex.: Rosa"></label>
      <label class="f">Gênero *
        <select id="fGen">${["Menino","Menina","Unissex"].map(g=>`<option ${p?.genero===g?"selected":""}>${g}</option>`).join("")}</select>
      </label>
    </div>
    <div class="row" style="margin-top:12px">
      <label class="f">Custo de compra (R$) *
        <input id="fCusto" inputmode="decimal" value="${p?nm(p.custo,2):""}" placeholder="0,00" oninput="calcMk()">
      </label>
      <label class="f">Valor de venda (R$) *
        <input id="fPreco" inputmode="decimal" value="${p?nm(p.preco,2):""}" placeholder="0,00" oninput="calcMk()">
      </label>
      <label class="f">${p?"Estoque atual":"Quantidade inicial"}
        <input id="fQtd" type="number" min="0" step="1" value="${p?(p.estoque||0):1}" ${p?"readonly":""}>
      </label>
    </div>
    <div id="mkBox" class="hint" style="margin-top:12px;padding:11px 13px;background:var(--laranja-fraco);border-radius:9px"></div>
    ${p?'<p class="hint" style="margin:10px 0 0">O estoque só muda pela tela de Estoque ou por vendas, para manter o histórico correto.</p>':""}
  `, `<button class="btn sec" onclick="fechar()">Cancelar</button>
      <button class="btn" onclick="salvarProduto('${id||""}')">${p?"Salvar alterações":"Cadastrar produto"}</button>`);

  setTimeout(()=>$(p||codigo ? "#fMarca" : "#fCod").focus(), 60);
}

function calcMk(){
  const c = numero($("#fCusto")?.value), v = numero($("#fPreco")?.value);
  const box = $("#mkBox"); if(!box) return;
  if(!c || !v){ box.innerHTML = "Preencha custo e venda para ver o markup e o lucro da peça."; return; }
  const l = v-c;
  box.innerHTML = `<b>Markup ${pct(l/c)}</b> · Lucro por peça <b>${brl(l)}</b> · Margem sobre a venda <b>${pct(l/v)}</b>`;
}

function salvarProduto(id){
  const cod = $("#fCod").value.trim();
  const dados = {
    codigo: cod, marca: $("#fMarca").value.trim(), modelo: $("#fModelo").value.trim(),
    tamanho: $("#fTam").value, cor: $("#fCor").value.trim(), genero: $("#fGen").value,
    custo: numero($("#fCusto").value), preco: numero($("#fPreco").value)
  };
  if(!cod)           return aviso("Informe o código de barras.","err");
  if(!dados.marca)   return aviso("Informe a marca.","err");
  if(!dados.modelo)  return aviso("Informe o modelo.","err");
  if(!dados.cor)     return aviso("Informe a cor.","err");
  if(dados.preco<=0) return aviso("Informe o valor de venda.","err");

  const dup = porCodigo(cod);
  if(dup && dup.id !== id){
    // Mostra o conflito inteiro: qual peça, com que código, e como chegar nela.
    window.__verConflito = () => {
      fechar();
      filtroProd = {q:dup.codigo, genero:"", tamanho:"", marca:"", estoque:"", excluidos:false};
      irPara("produtos");
    };
    const igual = limpaCodigo(dup.codigo) === limpaCodigo(cod);
    modal("Código de barras já usado", `
      <p style="margin:0 0 12px">Já existe uma peça <b>ativa</b> com este código:</p>
      <table style="margin-bottom:12px"><tbody>
        <tr><th style="width:150px">Peça</th><td><b>${esc(descProduto(dup))}</b></td></tr>
        <tr><th>Código cadastrado</th><td class="mono">${esc(dup.codigo)}</td></tr>
        <tr><th>Código digitado</th><td class="mono">${esc(cod)}</td></tr>
        <tr><th>Estoque</th><td>${dup.estoque||0} peça(s)</td></tr>
      </tbody></table>
      <p class="hint" style="margin:0">${ igual
        ? "É o mesmo código. Se a peça na sua mão é outra, use um código diferente para ela."
        : "Os códigos não são idênticos, mas o sistema os trata como iguais (ignora espaços, pontuação e zeros à esquerda). Se são peças diferentes mesmo, dê um código realmente distinto à nova." }</p>`,
      `<button class="btn sec" onclick="fechar()">Voltar</button>
       <button class="btn" onclick="__verConflito()">Ver esta peça no cadastro</button>`);
    return;
  }

  // O código pode pertencer a uma peça excluída — que some da lista mas continua
  // no histórico das vendas. Em vez de barrar sem explicação, oferece reativar.
  const morto = excluidoPorCodigo(cod);
  if(morto && morto.id !== id){
    const estoqueReal = morto.estoque||0;
    window.__reativar = () => {
      // O estoque NAO e mexido aqui: a peca tem historico real. Ajuste, se
      // precisar, e feito na tela de Estoque, que deixa rastro.
      reativarProduto(morto.id, dados);
      fechar(); render();
      aviso(`"${descProduto(morto)}" voltou ao cadastro com ${estoqueReal} peça(s) e o histórico.`,"ok");
    };
    modal("Este código pertence a uma peça excluída", `
      <p style="margin:0 0 12px">O código <b class="mono">${esc(cod)}</b> é de
        <b>${esc(descProduto(morto))}</b>, que foi excluída do cadastro.</p>
      <p class="hint" style="margin:0 0 12px">Ela não aparece na lista, mas continua no histórico das
        vendas — por isso o código segue reservado. Dá para devolvê-la ao cadastro com os dados que
        você acabou de preencher, mantendo todo o histórico.</p>
      <p class="hint" style="margin:0;padding:10px 12px;background:var(--laranja-fraco);border-radius:9px">
        O estoque dela volta como está hoje: <b>${estoqueReal} peça(s)</b>.
        Se o número não confere com a arara, corrija depois em
        <b>Estoque &gt; Movimentar &gt; Ajuste de inventário</b>.</p>`,
      `<button class="btn sec" onclick="fechar()">Voltar</button>
       <button class="btn" onclick="__reativar()">Reativar esta peça</button>`);
    return;
  }

  if(id){
    Object.assign(produto(id), dados);
    aviso("Produto atualizado.","ok");
  }else{
    const p = {...dados, id:uid(), estoque:0, ativo:true, criadoEm:new Date().toISOString()};
    DB.produtos.push(p);
    const q = parseInt($("#fQtd").value)||0;
    if(q>0) movimentar(p.id,"compra",q,{custo:p.custo, obs:"Cadastro inicial"});
    aviso(`Produto cadastrado${q?` com ${q} peça(s) em estoque`:""}.`,"ok");
  }
  salvar(); fechar(); render();
}

function excluirProduto(id){
  const p = produto(id);
  const vendasComEle = DB.vendas.filter(v=>v.itens.some(i=>i.produtoId===id));
  const movs = DB.movimentos.filter(m=>m.produtoId===id).length;

  if(!vendasComEle.length){
    confirmar("Excluir produto",
      `Excluir <b>${esc(descProduto(p))}</b> (código ${esc(p.codigo)})?<br><br>
       Não há vendas com este produto — ele e as ${movs} movimentação(ões) dele serão apagados
       definitivamente.`,
      ()=>{ apagarProdutoDeVez(id); aviso("Produto apagado.","ok"); }, "Excluir");
    return;
  }

  // Com vendas no histórico há duas intenções possíveis: tirar da lista
  // preservando os relatórios antigos, ou limpar um cadastro de teste.
  window.__soDaLista = () => {
    fechar(); p.ativo = false;
    carrinho = carrinho.filter(i=>i.produtoId!==id);
    salvar(); render();
    aviso("Produto retirado da lista. O histórico foi preservado.","ok");
  };
  window.__apagarTudo = () => {
    fechar();
    confirmar("Apagar tudo desta peça",
      `Isto apaga <b>${esc(descProduto(p))}</b>, as ${movs} movimentação(ões) dela e a retira de
       <b>${vendasComEle.length} venda(s)</b>. Venda que ficar sem nenhum item é removida.<br><br>
       Os relatórios do passado mudam. <b>Não há como desfazer</b> sem um backup.`,
      ()=>{ const r = apagarProdutoDeVez(id);
            aviso(`Peça apagada — ${r.movs} movimentação(ões) e ${r.vendas} venda(s) removidas.`,"ok"); },
      "Apagar definitivamente");
  };
  modal("Excluir produto", `
    <p style="margin:0 0 14px"><b>${esc(descProduto(p))}</b> — código ${esc(p.codigo)}<br>
      <span class="hint">${vendasComEle.length} venda(s) e ${movs} movimentação(ões) ligadas a ela.</span></p>
    <div style="background:var(--laranja-fraco);padding:12px 14px;border-radius:10px;margin-bottom:12px">
      <b>Tirar da lista</b> <span class="hint">(recomendado)</span><br>
      <span class="hint">Ela some do cadastro e do "precisa repor", mas continua no histórico —
      seus relatórios de faturamento e lucro do passado ficam iguais. Dá para restaurar depois.</span>
    </div>
    <div style="background:#FDE9E7;padding:12px 14px;border-radius:10px">
      <b>Apagar definitivamente</b><br>
      <span class="hint">Some tudo: a peça, as movimentações e a participação dela nas vendas.
      Use quando o cadastro foi só teste. Os números do passado mudam.</span>
    </div>`,
    `<button class="btn sec" onclick="fechar()">Voltar</button>
     <button class="btn dan" onclick="__apagarTudo()">Apagar definitivamente</button>
     <button class="btn" onclick="__soDaLista()">Tirar da lista</button>`);
}

/** Remove a peça e todo rastro dela: movimentações, itens de venda e o cadastro. */
function apagarProdutoDeVez(id){
  const movs = DB.movimentos.filter(m=>m.produtoId===id).length;
  const remover = new Set();
  for(const v of DB.vendas){
    if(!v.itens.some(i=>i.produtoId===id)) continue;
    v.itens = v.itens.filter(i=>i.produtoId!==id);
    if(!v.itens.length){ remover.add(v.id); continue; }
    v.subtotal = v.itens.reduce((s,x)=>s+x.preco*x.qtd,0);
    v.custo    = v.itens.reduce((s,x)=>s+x.custo*x.qtd,0);
    v.total    = v.subtotal - (v.desconto||0);
    v.lucro    = v.total - v.custo;
  }
  DB.vendas     = DB.vendas.filter(v=>!remover.has(v.id));
  DB.movimentos = DB.movimentos.filter(m=>m.produtoId!==id);
  DB.produtos   = DB.produtos.filter(x=>x.id!==id);
  carrinho        = carrinho.filter(i=>i.produtoId!==id);
  troca.entradas  = troca.entradas.filter(i=>i.produtoId!==id);
  troca.saidas    = troca.saidas.filter(i=>i.produtoId!==id);
  salvarEmAndamento(); salvar(); render();
  return {movs, vendas: remover.size};
}

/** Devolve uma peça excluída à lista, com o histórico dela. */
function restaurarProduto(id){
  const p = produto(id); if(!p) return;
  confirmar("Restaurar peça",
    `Devolver <b>${esc(descProduto(p))}</b> ao cadastro?<br><br>
     Ela volta a aparecer na lista e pode ser vendida. O histórico e o estoque
     (${p.estoque||0} peça(s)) são preservados.`,
    ()=>{ reativarProduto(id); render(); aviso("Peça restaurada.","ok"); }, "Restaurar");
}

function fichaProduto(id){
  const p = produto(id); if(!p) return;
  const movs = DB.movimentos.filter(m=>m.produtoId===id).sort((a,b)=>a.data<b.data?1:-1).slice(0,40);

  const qtdV = vend.reduce((s,v)=>s+v.itens.filter(i=>i.produtoId===id).reduce((x,i)=>x+i.qtd,0),0);
  const recV = vend.reduce((s,v)=>s+v.itens.filter(i=>i.produtoId===id).reduce((x,i)=>x+i.preco*i.qtd,0),0);
  const mk = markup(p);
  modal(descProduto(p), `
    <div class="grid g4" style="margin-bottom:16px">

      <div class="kpi ver"><div class="k">Vendidas</div><div class="v">${qtdV}</div><div class="s">${brl(recV)}</div></div>
      <div class="kpi cia"><div class="k">Markup</div><div class="v">${mk===null?"—":pct(mk)}</div><div class="s">Lucro ${brl(p.preco-p.custo)}/peça</div></div>
      <div class="kpi ama"><div class="k">Preço</div><div class="v" style="font-size:21px">${brl(p.preco)}</div><div class="s">Custo ${brl(p.custo)}</div></div>
    </div>
    <table style="margin-bottom:16px"><tbody>
      <tr><th style="width:130px">Código</th><td class="mono">${esc(p.codigo)}</td></tr>
      <tr><th>Marca / Modelo</th><td>${esc(p.marca)} — ${esc(p.modelo)}</td></tr>
      <tr><th>Tamanho / Cor</th><td>${esc(p.tamanho)} · ${esc(p.cor)}</td></tr>
      <tr><th>Gênero</th><td>${tagGenero(p.genero)}</td></tr>
      <tr><th>Cadastrado em</th><td>${dataBR(p.criadoEm)}</td></tr>
    </tbody></table>
    <h3 style="font-size:14px;color:var(--marrom);margin-bottom:8px">Movimentações</h3>
    <div class="tw" style="max-height:280px;overflow:auto">
      <table><thead><tr><th>Data</th><th>Movimento</th><th class="num">Qtd</th><th class="num">Saldo</th><th>Obs.</th></tr></thead>
      <tbody>${ movs.length ? movs.map(m=>`<tr>
          <td>${dataBR(m.data)}</td>
          <td><span class="tag ${m.tipo==="entrada"?"e":"s"}">${MOTIVOS[m.motivo].r}</span></td>
          <td class="num ${m.delta>0?"pos":"neg"}"><b>${m.delta>0?"+":""}${m.delta}</b></td>
          <td class="num">${m.saldo}</td><td class="hint">${esc(m.obs)}</td></tr>`).join("")
        : `<tr><td colspan="5" class="vazio">Sem movimentações</td></tr>` }</tbody></table>
    </div>`,
    `<button class="btn sec" onclick="fechar();formMovimento('${id}')">Movimentar estoque</button>
     <button class="btn sec" onclick="fechar();formProduto('${id}')">Editar</button>
     <button class="btn" onclick="fechar()">Fechar</button>`, true);
}

function resumoCliente(id){

/** Botão de WhatsApp com mensagem de parabéns pronta. */
function htmlZap(c, aniv, rotulo){
  if(!c) return "";
  const msg = aniv
    ? `Oi, ${c.nome.split(" ")[0]}! A Kava Kids passou para desejar um feliz aniversário ${aniv.tipo==="Criança"?"para "+aniv.quem:""}! 🧡`
    : `Oi, ${c.nome.split(" ")[0]}! Aqui é da Kava Kids. 🧡`;
  const href = zapLink(c.telefone, msg);
  if(!href) return "";
  const n = zapNumero(c.telefone);
  return `<a class="btn gh sm" style="text-decoration:none" target="_blank" rel="noopener"
    href="${href}" title="Abrir conversa no WhatsApp (+${n})">${rotulo || "WhatsApp"}</a>`;
}

function pintaCriancas(){
  $("#criancas").innerHTML = window.__criancas.map((k,i)=>`
    <div class="row" style="margin-bottom:8px">
      <label class="f">Nome da criança

      </label>

        <input type="date" value="${esc(k.nascimento)}" onchange="__criancas[${i}].nascimento=this.value">

function addCrianca(){ window.__criancas.push({nome:"",nascimento:""}); pintaCriancas(); }
function delCrianca(i){ window.__criancas.splice(i,1); if(!window.__criancas.length) window.__criancas.push({nome:"",nascimento:""}); pintaCriancas(); }

function avisaCpf(){
  const el = $("#cpfAviso"); if(!el) return;
  const v = $("#cCpf").value;
  if(!soDigitos(v)){ el.innerHTML = "O CPF é opcional."; el.style.color = ""; return; }
  const ok = cpfValido(v);
  el.innerHTML = ok ? "CPF válido." : "CPF inválido — confira os números.";
  el.style.color = ok ? "#5b8215" : "#c14a41";
}

function salvarCliente(id){
  const nome = $("#cNome").value.trim();
  if(!nome) return aviso("Informe o nome do comprador.","err");
  const cpf = $("#cCpf").value.trim();
  if(soDigitos(cpf) && !cpfValido(cpf)) return aviso("CPF inválido. Corrija ou deixe em branco.","err");
  const email = $("#cMail").value.trim();
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return aviso("E-mail inválido.","err");

  const dup = DB.clientes.find(c => c.ativo!==false && c.id!==id && soDigitos(cpf) &&
                                    soDigitos(c.cpf)===soDigitos(cpf));
  if(dup) return aviso(`Este CPF já está cadastrado para ${dup.nome}.`,"err");

  const dados = {
    nome, nascimento: $("#cNasc").value || "", telefone: $("#cTel").value.trim(),
    email, cpf: cpf ? cpfFmt(cpf) : "", obs: $("#cObs").value.trim(),
    criancas: window.__criancas.filter(k=>k.nome.trim() || k.nascimento).map(k=>({nome:k.nome.trim(), nascimento:k.nascimento}))
  };

  let alvo;
  if(id){ alvo = cliente(id); Object.assign(alvo, dados); aviso("Cliente atualizado.","ok"); }
  else  { alvo = {...dados, id:uid(), ativo:true, criadoEm:new Date().toISOString()};
          DB.clientes.push(alvo); aviso("Cliente cadastrado.","ok"); }

  salvar(); fechar();
  const cb = window.__aoSalvarCliente; window.__aoSalvarCliente = null;
  if(cb) cb(alvo.id); else render();
}

function excluirCliente(id){
  const c = cliente(id);
  const compras = DB.vendas.filter(v=>v.clienteId===id).length;
  confirmar("Excluir cliente",
    `Excluir <b>${esc(c.nome)}</b>?` + (compras
      ? `<br><br>Este cliente tem <b>${compras} compra(s)</b> registradas. Ele sai da lista, mas as vendas continuam no histórico.`
      : `<br><br>Não há compras vinculadas — o cadastro será removido definitivamente.`),
    ()=>{
      if(compras) c.ativo = false;
      else DB.clientes = DB.clientes.filter(x=>x.id!==id);
      if(vendaCliente===id) vendaCliente = null;
      salvar(); render(); aviso("Cliente excluído.","ok");
    },"Excluir");
}
