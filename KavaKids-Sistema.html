/** Seletor de cliente reutilizado pelo PDV e pela vinculação posterior. */
function escolherCliente(aoEscolher, titulo){
  window.__pickCli = id => { fechar(); aoEscolher(id); };
  window.__novoCli = () => { fechar(); formCliente(null, id => aoEscolher(id)); };
  window.__filtraCli = q => {
    q = q.toLowerCase().trim();
    const r = DB.clientes.filter(c=>c.ativo!==false)
      .filter(c => !q || (c.nome+" "+(c.telefone||"")+" "+(c.email||"")+" "+(c.cpf||"")+" "+
                          (c.criancas||[]).map(k=>k.nome).join(" ")).toLowerCase().includes(q))
      .sort((a,b)=>a.nome.localeCompare(b.nome)).slice(0,60);
    $("#cliRes").innerHTML = r.length ? r.map(c=>{
      const rc = resumoCliente(c.id);
      return `<tr style="cursor:pointer" onclick="__pickCli('${c.id}')">
        <td><b>${esc(c.nome)}</b>${(c.criancas||[]).length?`<br><span class="hint">${esc(c.criancas.map(k=>k.nome).filter(Boolean).join(", "))}</span>`:""}</td>
        <td>${esc(c.telefone||"—")} ${htmlZap(c,null,"↗")}</td>
        <td class="mono" style="font-size:12.5px">${esc(c.cpf||"—")}</td>
        <td class="num">${rc.vendas}</td>
        <td class="num">${brl(rc.receita)}</td></tr>`;
    }).join("") : `<tr><td colspan="5" class="vazio">Nenhum cliente encontrado</td></tr>`;
  };
  modal(titulo || "Selecionar cliente", `
    <div class="row">
      <input id="cliQ" placeholder="Nome, telefone, CPF ou nome da criança…" oninput="__filtraCli(this.value)" autocomplete="off">
      <button class="btn" style="flex:none" onclick="__novoCli()">+ Cadastrar novo</button>
    </div>
    <div class="tw" style="max-height:400px;overflow:auto;margin-top:12px">
      <table><thead><tr><th>Cliente</th><th>Telefone</th><th>CPF</th><th class="num">Compras</th><th class="num">Total</th></tr></thead>
      <tbody id="cliRes"></tbody></table></div>`, "", true);
  __filtraCli("");
  setTimeout(()=>$("#cliQ").focus(), 50);
}

/* =======================================================================
   TELA 4 — ESTOQUE
   ======================================================================= */
let filtroMov = {motivo:"", periodo:"30dias"};

function telaEstoque(){
  $("#tAcoes").innerHTML =
    `<button class="btn sec" onclick="imprimirRelatorio('estoque')">Imprimir posição</button>
     <button class="btn sec" onclick="buscarProduto('mov')">+ Movimentar estoque</button>`;

  const ativos = DB.produtos.filter(p=>p.ativo!==false);
  const min = DB.config.estoqueMinimo||0;
  // Saldo negativo é erro de cadastro, não patrimônio: não entra na conta do dinheiro.
  const emCaixa = p => Math.max(0, p.estoque||0);
  const pecas = ativos.reduce((s,p)=>s+emCaixa(p),0);
  const valorCusto = ativos.reduce((s,p)=>s+emCaixa(p)*(p.custo||0),0);
  const valorVenda = ativos.reduce((s,p)=>s+emCaixa(p)*(p.preco||0),0);
  const baixos = ativos.filter(p=>(p.estoque||0)<=min);
  const negativos = ativos.filter(p=>(p.estoque||0)<0);

  const per = periodo(filtroMov.periodo);
  const movs = DB.movimentos
    .filter(m => diaDe(m.data)>=per.de && diaDe(m.data)<=per.ate && (!filtroMov.motivo || m.motivo===filtroMov.motivo))
    .sort((a,b)=>a.data<b.data?1:-1);

  $("#view").innerHTML = `
  <div class="grid">
    <div class="scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5v14M7 5v14M11 5v10M15 5v14M19 5v14M21 5v14"/></svg>
      <div class="l">Movimentar por código de barras<small>Bipe a peça para dar entrada, baixa ou ajuste</small></div>
      <div style="flex:1"><input id="estCod" placeholder="Passe o leitor aqui" autocomplete="off"></div>
    </div>

    <div class="grid g4">
      <div class="kpi lar"><div class="k">Peças em estoque</div><div class="v">${nm(pecas)}</div><div class="s">${ativos.length} produtos</div></div>
      <div class="kpi cia"><div class="k">Investido (custo)</div><div class="v" style="font-size:22px">${brl(valorCusto)}</div></div>
      <div class="kpi ver"><div class="k">Potencial de venda</div><div class="v" style="font-size:22px">${brl(valorVenda)}</div>
        <div class="s pos">Lucro potencial ${brl(valorVenda-valorCusto)}</div></div>
      <div class="kpi cor"><div class="k">Estoque baixo</div><div class="v">${baixos.length}</div><div class="s">≤ ${min} peça(s)</div></div>
    </div>

    ${ negativos.length ? `
    <div class="semEstoque" style="background:#a8392f">
      <div class="ic">⚠️</div>
      <div class="t">ESTOQUE NEGATIVO EM ${negativos.length} PEÇA(S)
        <small>Saldo negativo não existe na prática — normalmente vem de uma entrada apagada
        depois das vendas. Enquanto durar, essas peças ficam de fora do cálculo de custo e
        de potencial de venda.<br>Conte as peças na arara e corrija.</small>
      </div>
      <div class="acoes"><button onclick="corrigirNegativos()">Zerar os saldos negativos</button></div>
    </div>` : "" }

    ${ baixos.length ? `
    <div class="card">
      <div class="ch"><h3>Precisa repor</h3><span class="hint">Ajuste o limite em Configurações</span></div>
      <div class="cb" style="padding:0"><div class="tw"><table><thead><tr>
        <th>Código</th><th>Peça</th><th>Gênero</th><th class="num">Estoque</th><th></th></tr></thead><tbody>
        ${baixos.map(p=>`<tr>
          <td class="mono" style="font-size:12.5px">${esc(p.codigo)}</td>
          <td>${esc(descProduto(p))}</td><td>${tagGenero(p.genero)}</td>
          <td class="num">${ (p.estoque||0) < 0
            ? `<span class="tag s">${p.estoque} — negativo</span>`
            : `<span class="tag al">${p.estoque||0}</span>` }</td>
          <td class="num" style="white-space:nowrap">
            <button class="btn sm sec" onclick="formMovimento('${p.id}','compra')">Dar entrada</button>
            <button class="btn gh sm" onclick="excluirProduto('${p.id}')" title="Excluir esta peça">🗑</button>
          </td>
        </tr>`).join("")}</tbody></table></div></div>
    </div>` : "" }

    <div class="card">
      <div class="ch">
        <h3>Movimentações</h3>
        <div class="row" style="gap:8px">
          <select style="width:auto" onchange="filtroMov.periodo=this.value; telaEstoque()">
            ${["hoje","7dias","semana","30dias","mes","mespass","ano"].map(k=>{
              const p=periodo(k); return `<option value="${k}" ${filtroMov.periodo===k?"selected":""}>${p.nome}</option>`}).join("")}
          </select>
          <select style="width:auto" onchange="filtroMov.motivo=this.value; telaEstoque()">
            <option value="">Todos os movimentos</option>
            ${Object.entries(MOTIVOS).map(([k,v])=>`<option value="${k}" ${filtroMov.motivo===k?"selected":""}>${v.r}</option>`).join("")}
          </select>
        </div>
      </div>
      <div class="cb" style="padding:0">
        ${ movs.length ? `<div class="tw" style="max-height:520px;overflow:auto"><table><thead><tr>
          <th>Data</th><th>Peça</th><th>Movimento</th><th class="num">Qtd</th><th class="num">Saldo</th><th>Observação</th><th></th>
        </tr></thead><tbody>${movs.map(m=>{
          const p = produto(m.produtoId);
          return `<tr>
            <td style="white-space:nowrap">${dataBR(m.data)} <span class="hint">${horaBR(m.data)}</span></td>
            <td>${esc(p?descProduto(p):"(produto excluído)")}<br><span class="hint mono">${esc(m.codigo||"")}</span></td>
            <td><span class="tag ${m.tipo==="entrada"?"e":"s"}">${MOTIVOS[m.motivo].r}</span></td>
            <td class="num ${m.delta>0?"pos":"neg"}"><b>${m.delta>0?"+":""}${m.delta}</b></td>
            <td class="num">${m.saldo}</td>
            <td class="hint">${esc(m.obs)}${m.vendaId?" (venda)":""}</td>
            <td class="num">${ m.vendaId
              ? `<button class="btn gh sm" onclick="movimentoDeVenda('${m.vendaId}')" title="Veio de uma venda">🔗</button>`
              : `<button class="btn gh sm" onclick="excluirMovimento('${m.id}')" title="Excluir movimento">🗑</button>`}</td>
          </tr>`}).join("")}</tbody></table></div>`
        : `<div class="vazio"><b>Nenhuma movimentação no período</b>Use "Movimentar estoque" para dar entrada ou baixa.</div>` }
      </div>
    </div>
  </div>`;

  registrarLeitor("estCod", cod => {
    const p = porCodigo(cod);
    if(p && p.ativo!==false) formMovimento(p.id, "compra");
    else{
      aviso("Código não cadastrado — abrindo cadastro.","err");
      irPara("produtos"); setTimeout(()=>formProduto(null, cod), 60);
    }
  });
}

/** Movimentação gerada por venda/troca: só some se a venda for excluída. */
function movimentoDeVenda(vendaId){
  const v = DB.vendas.find(x=>x.id===vendaId);
  if(!v) return aviso("A venda desta movimentação não existe mais.","err");
  window.__verVendaMov = () => { fechar(); verVenda(vendaId); };
  modal("Movimentação gerada por uma venda", `
    <p style="margin:0 0 12px">Esta movimentação veio da
      <b>${v.tipo==="troca"?"troca":"venda"} #${v.numero}</b>, de ${dataBR(v.data)}.</p>
    <p class="hint" style="margin:0">Ela não é excluída sozinha, senão o estoque e a venda ficariam
      contando coisas diferentes. Para desfazer, exclua a ${v.tipo==="troca"?"troca":"venda"}: as peças
      voltam ao estoque automaticamente.</p>`,
    `<button class="btn sec" onclick="fechar()">Voltar</button>
     <button class="btn" onclick="__verVendaMov()">Abrir a ${v.tipo==="troca"?"troca":"venda"} #${v.numero}</button>`);
}

/** Traz para zero, com rastro, todo saldo que ficou negativo. */
function corrigirNegativos(){
  const negativos = DB.produtos.filter(p=>p.ativo!==false && (p.estoque||0) < 0);
  if(!negativos.length) return;
  confirmar("Zerar saldos negativos",
    `${negativos.length} peça(s) estão com estoque negativo:<br><br>` +
    negativos.map(p=>`• <b>${esc(descProduto(p))}</b>: ${p.estoque}`).join("<br>") +
    `<br><br>Cada uma recebe um <b>ajuste de inventário</b> que leva o saldo a <b>zero</b>,
     registrado no histórico. Depois, dê entrada da quantidade que você realmente tem.`,
    ()=>{
      for(const p of negativos)
        movimentar(p.id, "ajuste_ent", -(p.estoque||0), {custo:p.custo, obs:"Correção de estoque negativo"});
      salvar(); render();
      aviso(`${negativos.length} saldo(s) corrigido(s) para zero.`,"ok");
    }, "Zerar saldos");
}

function formMovimento(produtoId, motivoPadrao){
  const p = produto(produtoId); if(!p) return;
  modal("Movimentar estoque", `
    <div style="background:var(--laranja-fraco);padding:12px 14px;border-radius:10px;margin-bottom:16px">
      <b>${esc(descProduto(p))}</b><br>
      <span class="hint mono">${esc(p.codigo)} · estoque atual <b>${p.estoque||0}</b> · custo ${brl(p.custo)}</span>
    </div>
    <div class="row">
      <label class="f">Tipo de movimento
        <select id="mMotivo" onchange="mvCustoVis()">
          <optgroup label="Entradas">
            ${["compra","troca_entrada","ajuste_ent"].map(k=>`<option value="${k}" ${motivoPadrao===k?"selected":""}>${MOTIVOS[k].r}</option>`).join("")}
          </optgroup>
          <optgroup label="Saídas">
            ${["troca_saida","perda","ajuste_sai"].map(k=>`<option value="${k}" ${motivoPadrao===k?"selected":""}>${MOTIVOS[k].r}</option>`).join("")}
          </optgroup>
        </select>
      </label>
      <label class="f" style="flex:0 1 120px">Quantidade
        <input id="mQtd" type="number" min="1" step="1" value="1">
      </label>
      <label class="f" style="flex:0 1 150px">Data
        <input id="mData" type="date" value="${hoje()}">
      </label>
    </div>
    <div class="row" id="mCustoBox" style="margin-top:12px">
      <label class="f">Custo unitário desta entrada (R$)
        <input id="mCusto" inputmode="decimal" value="${nm(p.custo,2)}">
      </label>
      <label class="f" style="flex:0 1 100%;flex-direction:row;align-items:center;gap:8px;text-transform:none;font-size:13.5px">
        <input type="checkbox" id="mAtualiza" style="width:auto"> Atualizar o custo cadastrado do produto
      </label>
    </div>
    <label class="f" style="margin-top:12px">Observação
      <input id="mObs" placeholder="Ex.: Nota 1234 — fornecedor X">
    </label>`,
    `<button class="btn sec" onclick="fechar()">Cancelar</button>
     <button class="btn" onclick="salvarMovimento('${produtoId}')">Registrar movimento</button>`);
  mvCustoVis();
  // o leitor já identificou a peça: o foco vai direto para a quantidade
  const q = $("#mQtd");
  setTimeout(()=>{ q.focus(); q.select(); }, 60);
  q.addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); salvarMovimento(produtoId); } });
}
function mvCustoVis(){
  const ent = MOTIVOS[$("#mMotivo").value].t === "entrada";
  $("#mCustoBox").style.display = ent ? "flex" : "none";
}

function salvarMovimento(id){
  const motivo = $("#mMotivo").value;
  const qtd = parseInt($("#mQtd").value)||0;
  if(qtd<1) return aviso("Informe a quantidade.","err");
  const p = produto(id);
  const ent = MOTIVOS[motivo].t==="entrada";
  if(!ent && qtd > (p.estoque||0))
    return aviso(`Só há ${p.estoque||0} peça(s) de "${descProduto(p)}". O estoque não pode ficar negativo.`,"err");
  const custo = ent ? numero($("#mCusto").value) : p.custo;
  if(ent && $("#mAtualiza").checked) p.custo = custo;
  const d = $("#mData").value || hoje();
  const dt = new Date(d + "T" + new Date().toTimeString().slice(0,8)).toISOString();
  movimentar(id, motivo, qtd, {custo, obs:$("#mObs").value.trim(), data:dt});
  salvar(); fechar(); render();
  aviso(`${MOTIVOS[motivo].r}: ${ent?"+":"−"}${qtd} peça(s).`,"ok");
}

function excluirMovimento(movId){
  const m = DB.movimentos.find(x=>x.id===movId); if(!m) return;
  const p = produto(m.produtoId);
  const resultado = (p?.estoque||0) - m.delta;

  const apagar = () => {
    if(p) p.estoque = resultado;
    DB.movimentos = DB.movimentos.filter(x=>x.id!==movId);
    salvar(); render(); aviso("Movimentação excluída.","ok");
  };

  // Deixar negativo é permitido, mas nunca por descuido: o aviso mostra o
  // resultado e oferece o ajuste de inventário, que é o caminho limpo.
  if(p && resultado < 0){
    window.__apagarMov = () => { fechar(); apagar(); };
    window.__ajustar   = () => { fechar(); formMovimento(p.id, "ajuste_ent"); };
    modal("Esta exclusão deixa o estoque negativo", `
      <p style="margin:0 0 12px">Excluir <b>${MOTIVOS[m.motivo].r}</b> de
        ${m.delta>0?"+":""}${m.delta} peça(s) deixa <b>${esc(descProduto(p))}</b> com
        <b>${resultado} peça(s)</b>, porque parte delas já saiu em vendas.</p>
      <p class="hint" style="margin:0 0 12px">Se isto é limpeza de teste, pode seguir — o aviso de
        saldo negativo aparece na tela de Estoque com o botão de zerar. Se a intenção é só corrigir
        a quantidade, o <b>Ajuste de inventário</b> é melhor: acerta o número sem apagar histórico.</p>`,
      `<button class="btn sec" onclick="fechar()">Voltar</button>
       <button class="btn sec" onclick="__ajustar()">Fazer ajuste</button>
       <button class="btn dan" onclick="__apagarMov()">Excluir mesmo assim</button>`);
    return;
  }

  confirmar("Excluir movimentação",
    `Excluir <b>${MOTIVOS[m.motivo].r}</b> de ${m.delta>0?"+":""}${m.delta} peça(s)?<br><br>
     O estoque de <b>${esc(descProduto(p))}</b> passa de ${p?.estoque||0} para <b>${resultado}</b>.`,
    apagar, "Excluir");
}

        </div>
        <div class="row" style="gap:8px">
          <input placeholder="Buscar venda, peça…" value="${esc(filtroVenda.q)}" style="width:200px"

          <select style="width:auto" onchange="filtroVenda.tipo=this.value;telaVendas()">
            <option value="">Vendas e trocas</option>
            <option value="venda" ${filtroVenda.tipo==="venda"?"selected":""}>Só vendas</option>
            <option value="troca" ${filtroVenda.tipo==="troca"?"selected":""}>Só trocas</option>
          </select>
          <select style="width:auto" onchange="filtroVenda.pag=this.value;telaVendas()">
            <option value="">Todos pagamentos</option>
            ${["Dinheiro","PIX","Débito","Crédito","Crédito parcelado","Troca / crédito"].map(x=>`<option ${filtroVenda.pag===x?"selected":""}>${x}</option>`).join("")}
          </select>
          <label class="f" style="flex-direction:row;align-items:center;gap:6px;text-transform:none;font-size:13px;flex:none">
            <input type="checkbox" style="width:auto" ${filtroVenda.mostrarCanceladas?"checked":""}

          </label>
        </div>
      </div>
    </div></div>

    <div class="grid g4">
      <div class="kpi lar"><div class="k">Faturamento</div><div class="v" style="font-size:23px">${brl(r.receita)}</div><div class="s">${per.de===per.ate?dataBR(per.de):dataBR(per.de)+" a "+dataBR(per.ate)}</div></div>
      <div class="kpi cia"><div class="k">Vendas</div><div class="v">${r.vendas}</div>
        <div class="s">Ticket médio ${brl(r.ticket)}${r.trocas?` · ${r.trocas} troca(s)`:""}</div></div>
      <div class="kpi ama"><div class="k">Peças vendidas</div><div class="v">${r.pecas}</div>${r.devolvidas?`<div class="s">${r.devolvidas} devolvida(s)</div>`:""}</div>
      <div class="kpi ver"><div class="k">Lucro</div><div class="v" style="font-size:23px">${brl(r.lucro)}</div><div class="s">Margem ${pct(r.margem)}</div></div>
    </div>

    <div class="card">
      <div class="ch"><h3>Vendas do período</h3><button class="btn sec sm" onclick="exportarCSV('vendas')">Exportar CSV</button></div>
      <div class="cb" style="padding:0">
      ${ lista.length ? `<div class="tw"><table><thead><tr>
        <th>#</th><th>Data</th><th>Cliente</th><th>Peças</th><th>Pagamento</th>
        <th class="num">Total</th><th class="num">Custo</th><th class="num">Lucro</th><th></th>
      </tr></thead><tbody>${lista.map(v=>{
        const c = v.clienteId ? cliente(v.clienteId) : null;
        return `

          <td style="white-space:nowrap">${dataBR(v.data)}<br><span class="hint">${horaBR(v.data)}</span></td>
          <td>${ c ? `<b>${esc(c.nome)}</b> ${htmlZap(c,null,"↗")}`

          <td><span class="tag">${esc(v.pagamento)}</span></td>

    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div><span class="hint">Data</span><br><b>${dataBR(v.data)} às ${horaBR(v.data)}</b></div>
      <div><span class="hint">Pagamento</span><br><b>${esc(v.pagamento)}</b></div>
      <div><span class="hint">Peças</span><br><b>${v.itens.reduce((s,i)=>s+Math.abs(i.qtd),0)}</b></div>
    </div>
    <div style="background:var(--laranja-fraco);padding:11px 13px;border-radius:10px;margin-bottom:14px">
      <div class="row" style="align-items:center;justify-content:space-between;gap:8px">
        <div style="min-width:0">
          <span class="hint">Cliente</span><br>
          ${ c ? `<b>${esc(c.nome)}</b> <span class="hint">${esc(c.telefone||"")}</span>`
               : `<b>Venda sem cliente identificado</b>` }
        </div>
        <div style="flex:none">
          ${ c ? `${htmlZap(c)}
                  <button class="btn gh sm" onclick="fechar();fichaCliente('${c.id}')">Ficha</button>
                  <button class="btn gh sm" onclick="fechar();vincularCliente('${v.id}',true)">Trocar</button>
                  <button class="btn gh sm" onclick="fechar();desvincularCliente('${v.id}',true)" title="Desvincular">✕</button>`
               : `<button class="btn sm" onclick="fechar();vincularCliente('${v.id}',true)">Vincular cliente</button>` }
        </div>
      </div>
    </div>
    ${v.obs?`<p class="hint" style="margin:0 0 12px">${esc(v.obs)}</p>`:""}
    <div class="tw"><table><thead><tr><th>Código</th><th>Peça</th><th class="num">Qtd</th><th class="num">Unit.</th><th class="num">Total</th><th></th></tr></thead>
    <tbody>${v.itens.map((i,ix)=>`<tr>
      <td class="mono" style="font-size:12.5px">${esc(i.codigo)}</td><td>${esc(i.desc)}</td>
      <td class="num">${i.qtd}</td><td class="num">${brl(i.preco)}</td><td class="num"><b>${brl(i.preco*i.qtd)}</b></td>
      <td class="num">${v.cancelada?"":`<button class="btn gh sm" onclick="excluirItemVenda('${v.id}',${ix})" title="Excluir item">🗑</button>`}</td>
    </tr>`).join("")}</tbody></table></div>
    <div style="margin-top:14px;max-width:280px;margin-left:auto">
      <div class="tot"><span>Subtotal</span><b>${brl(v.subtotal)}</b></div>
      ${v.desconto?`<div class="tot"><span>Desconto</span><b class="neg">− ${brl(v.desconto)}</b></div>`:""}

    </div>`,
    `<button class="btn sec" onclick="imprimirVenda('${v.id}')">Imprimir recibo</button>

function excluirVenda(id){
  const v = DB.vendas.find(x=>x.id===id); if(!v || v.cancelada) return;
  confirmar("Excluir venda",
    `Excluir a venda <b>#${v.numero}</b> de ${brl(v.total)}?<br><br>As peças voltam ao estoque e a venda deixa de contar nos relatórios.`,
    ()=>{
      // O movimento original NÃO é apagado: fica no histórico com o estorno ao lado,
      // senão o saldo do produto deixa de bater com a soma das movimentações.
      for(const i of v.itens){
        if(i.qtd>0) movimentar(i.produtoId,"estorno_ent", i.qtd,{custo:i.custo, vendaId:v.id,
                      obs:`Estorno da ${v.tipo==="troca"?"troca":"venda"} #${v.numero}`});
        else        movimentar(i.produtoId,"estorno_sai",-i.qtd,{custo:i.custo, vendaId:v.id,
                      obs:`Estorno da ${v.tipo==="troca"?"troca":"venda"} #${v.numero}`});
      }
      v.cancelada = true; v.canceladaEm = new Date().toISOString();
      salvar(); render(); aviso(`Venda #${v.numero} excluída e estoque devolvido.`,"ok");
    },"Excluir venda");
}

function excluirItemVenda(vendaId, ix){
  const v = DB.vendas.find(x=>x.id===vendaId); if(!v) return;
  const i = v.itens[ix];
  confirmar("Excluir item da venda",
    `Remover <b>${esc(i.desc)}</b> da venda #${v.numero}?<br><br>A peça volta ao estoque e o total da venda é recalculado.`,
    ()=>{
      if(i.qtd>0) movimentar(i.produtoId,"estorno_ent", i.qtd,{custo:i.custo, vendaId:v.id,
                    obs:`Item removido da venda #${v.numero}`});
      else        movimentar(i.produtoId,"estorno_sai",-i.qtd,{custo:i.custo, vendaId:v.id,
                    obs:`Item removido da venda #${v.numero}`});
      v.itens.splice(ix,1);
      v.subtotal = v.itens.reduce((s,x)=>s+x.preco*x.qtd,0);
      v.custo    = v.itens.reduce((s,x)=>s+x.custo*x.qtd,0);
      v.total    = v.subtotal - (v.desconto||0);
      v.lucro    = v.total - v.custo;
      if(!v.itens.length){ v.cancelada = true; v.canceladaEm = new Date().toISOString(); }
      salvar(); render(); aviso("Item removido da venda.","ok");
      if(!v.cancelada) verVenda(v.id); else fechar();
    },"Excluir item");
}

/**
 * Monta o papel do recibo. Serve tanto para uma venda já gravada quanto para a
 * PRÉVIA do que está na tela — a prévia não grava nada e não baixa estoque.
 */
/**
 * Monta o cupom e manda imprimir SOMENTE ele. O documento traz apenas o preço
 * de venda — custo e lucro nunca entram, é papel que vai para o cliente.
 */
function montarRecibo(v, previa){
  const c = v.clienteId ? cliente(v.clienteId) : null;
  const cab = previa ? `${v.tipo==="troca"?"TROCA":"VENDA"} EM ANDAMENTO`
                     : `${v.tipo==="troca"?"TROCA":"VENDA"} Nº ${v.numero}`;
  // os dois lados são somados separadamente: numa troca eles não podem se anular no papel
  const levadas    = v.itens.filter(i=>i.qtd>0);
  const devolvidas = v.itens.filter(i=>i.qtd<0);
  const vLevado    = levadas.reduce((s,i)=>s+i.preco*i.qtd,0);
  const vDevolvido = devolvidas.reduce((s,i)=>s+i.preco*-i.qtd,0);
  const nLevadas   = levadas.reduce((s,i)=>s+i.qtd,0);
  const nDevolv    = devolvidas.reduce((s,i)=>s-i.qtd,0);
  const plural = (n,a,b) => `${n} ${n===1?a:b}`;

  const item = i => {
    const q = Math.abs(i.qtd), tot = i.preco*q;
    return `<div class="item">
      <div class="d">${esc(i.desc)}${i.qtd<0?" <b>[DEVOLVIDA]</b>":""}</div>
      <div class="q"><span>${q} x ${nm(i.preco,2)}</span>
        <span class="val">${i.qtd<0?"-":""}${nm(tot,2)}</span></div>
    </div>`;
  };

  $("#recibo").innerHTML = `<div class="recibo-doc">
    ${previa ? `<div class="tarja">PRÉVIA — NÃO FINALIZADA
        <span>Confira os valores antes de fechar</span></div>` : ""}
    ${(!previa && v.cancelada) ? `<div class="tarja">${v.tipo==="troca"?"TROCA":"VENDA"} CANCELADA
        <span>Este comprovante não é válido</span></div>` : ""}

    <div class="topo">
      <div class="marca">KAVA KIDS</div>
      <div>www.kavakids.com.br</div>
      <div class="doc">${cab}</div>
      <div>${dataBR(v.data)} às ${horaBR(v.data)}</div>
      ${c ? `<div>Cliente: ${esc(c.nome)}</div>` : ""}
      ${(!previa && v.reimpressao) ? `<div>2ª VIA — impressa em ${dataBR(hoje())}</div>` : ""}
    </div>

    <div class="hr"></div>
    <div class="cab"><span>Item</span><span>Valor R$</span></div>
    <div class="hr fina"></div>
    ${v.itens.map(item).join('<div class="hr fina"></div>')}
    <div class="hr"></div>

    ${ devolvidas.length ? `
      <div class="lin"><span>${plural(nLevadas,"peça levada","peças levadas")}</span>
        <span class="val">${nm(vLevado,2)}</span></div>
      <div class="lin"><span>${plural(nDevolv,"peça devolvida","peças devolvidas")}</span>
        <span class="val">- ${nm(vDevolvido,2)}</span></div>`
    : `<div class="lin"><span>${plural(nLevadas,"peça","peças")}</span>
        <span class="val">${nm(v.subtotal,2)}</span></div>` }
    ${v.desconto?`<div class="lin"><span>Desconto</span><span class="val">- ${nm(v.desconto,2)}</span></div>`:""}

    <div class="hr"></div>
    <div class="lin total"><span>${v.total<0?"CRÉDITO":v.total===0?"SEM DIFERENÇA":"TOTAL"}</span>
      <span class="val">${brl(Math.abs(v.total))}</span></div>
    <div class="hr"></div>
    <div class="lin forte"><span>${v.total<0?"Devolução por":"Pagamento"}</span><span>${esc(v.pagamento)}</span></div>
    ${v.total<0?`<div class="lin"><span>Valor a receber da loja</span><span></span></div>`:""}

    <div class="rodape">${
      previa ? "PRÉVIA — esta venda ainda não foi registrada.<br>Clique em Finalizar para concluir."
             : "Documento sem valor fiscal.<br>Não substitui NFC-e.<br><br>Obrigado pela preferência!"}</div>
  </div>`;

  imprimirSomenteRecibo();
}

/* --- Papel do cupom ---------------------------------------------------
   80 mm é o padrão das térmicas de cupom; a área que a cabeça imprime é
   de 72 mm. 58 mm e A4 ficam disponíveis para quem usa outro papel.    */
const CUPONS = {
  "80mm": {pagina:"80mm auto", margem:"0",    conteudo:"72mm", nome:"Térmica 80 mm (bobina)"},
  "58mm": {pagina:"58mm auto", margem:"0",    conteudo:"50mm", nome:"Térmica 58 mm (bobina)"},
  "a4":   {pagina:"A4",        margem:"12mm", conteudo:"72mm", nome:"Folha A4 comum"}
};
const papelCupom = () => CUPONS[DB.config.cupom] || CUPONS["80mm"];

/** Troca a regra @page conforme o que está sendo impresso. */
function definirPagina(css){
  let st = document.getElementById("estiloPagina");
  if(!st){ st = document.createElement("style"); st.id = "estiloPagina"; document.head.appendChild(st); }
  st.textContent = `@media print{ @page{ ${css} } }`;
}

/** Isola o cupom na folha: a tela, que mostra custo e lucro, não vai ao papel. */
function imprimirSomenteRecibo(){
  const c = papelCupom();
  document.documentElement.style.setProperty("--cupomW", c.conteudo);
  definirPagina(`size:${c.pagina}; margin:${c.margem}`);
  document.body.classList.add("imp-recibo");
  const limpar = () => document.body.classList.remove("imp-recibo");
  window.addEventListener("afterprint", limpar, {once:true});
  setTimeout(()=>{
    try{ window.print(); } finally { limpar(); focarLeitor(); }
  }, 120);
}

/* =====================================================================
   RELATÓRIOS EM BOBINA
   As telas usam tabelas largas que não cabem em 72 mm. Aqui os mesmos
   números são remontados em coluna única, para a mesma impressora.
   ===================================================================== */
const cL   = (a,b,cls="") => `<div class="lin ${cls}"><span>${a}</span><span class="val">${b}</span></div>`;
const cSec = t => `<div class="hr"></div><div class="secao">${esc(t)}</div><div class="hr fina"></div>`;
const cItem = (esq, dir, sub) => `<div class="item">
  <div class="q"><span>${esq}</span><span class="val">${dir}</span></div>
  ${sub ? `<div class="q sub"><span>${sub[0]}</span><span class="val">${sub[1]}</span></div>` : ""}</div>`;

function cupomTopo(titulo, sub){
  return `<div class="topo">
    <div class="marca">${esc((DB.config.loja||"Kava Kids").toUpperCase())}</div>
    <div class="doc">${esc(titulo)}</div>
    ${sub ? `<div>${sub}</div>` : ""}
    <div>emitido em ${dataBR(hoje())} às ${horaBR(new Date().toISOString())}</div>
  </div>`;
}

/** Envia um relatório para a mesma impressora do cupom. */
function montarRelatorio(html){
  $("#recibo").innerHTML = `<div class="recibo-doc rel">${html}
    <div class="hr"></div>
    <div class="rodape"><b>DOCUMENTO INTERNO</b><br>
      Contém custo e lucro — não entregar ao cliente.</div>
  </div>`;
  imprimirSomenteRecibo();
}

/** Bloco de resultado reaproveitado pelos relatórios. */
function blocoResultado(r){
  return cL("Faturamento", brl(r.receita), "destaque")
       + cL("Custo das peças", brl(r.custo))
       + cL("Lucro", brl(r.lucro), "forte")
       + cL("Margem", pct(r.margem))
       + cL("Markup", pct(r.markup))
       + `<div class="hr fina"></div>`
       + cL("Vendas", r.vendas + (r.trocas ? ` (${r.trocas} troca${r.trocas>1?"s":""})` : ""))
       + cL("Peças vendidas", r.pecas)
       + (r.devolvidas ? cL("Peças devolvidas", r.devolvidas) : "")
       + cL("Ticket médio", brl(r.ticket))
       + (r.desconto ? cL("Descontos dados", brl(r.desconto)) : "");
}

const NOMES_CAT = {marca:"Marca", modelo:"Modelo", tamanho:"Tamanho", cor:"Cor",
                   genero:"Gênero", pagamento:"Pagamento"};
const NOMES_GRAN = {dia:"Por dia", semana:"Por semana", mes:"Por mês", ano:"Por ano"};

/** Relatório de vendas: usa exatamente o período e os cortes escolhidos na tela. */
function cupomRelVendas(){
  const per = relPeriodo();
  const vendas = vendasNo(per.de, per.ate);
  const r = resumo(vendas);
  const linhas = serie(vendas, rel.agrupar);
  const cats = categorias(vendas, rel.categoria);
  const totCat = cats.reduce((s,x)=>s+x.receita,0) || 1;

  let h = cupomTopo("Relatório de Vendas",
    `${per.nome}<br>${dataBR(per.de)} a ${dataBR(per.ate)}`);
  h += cSec("Resumo do período") + blocoResultado(r);

  h += cSec(NOMES_GRAN[rel.agrupar] || "Evolução");
  h += linhas.length
    ? linhas.map(l => cItem(`<b>${esc(l.nome)}</b> · ${l.vendas}v · ${l.pecas}pç`,
                            brl(l.receita), ["lucro", brl(l.lucro)])).join("")
    : `<div class="vazio-cupom">Sem vendas no período</div>`;

  h += cSec("Por " + (NOMES_CAT[rel.categoria]||rel.categoria));
  h += cats.length
    ? cats.map(x => cItem(`<b>${esc(x.chave)}</b> · ${x.qtd}pç · ${pct(x.receita/totCat)}`,
                          brl(x.receita), ["lucro", brl(x.lucro)])).join("")
    : `<div class="vazio-cupom">Sem vendas no período</div>`;
  return h;
}

/** Relatório gerencial: faturamento, custo de aquisição, markup e lucro. */
function cupomRelGestao(){
  const pHoje=periodo("hoje"), pSem=periodo("semana"), pMes=periodo("mes"),
        pMesP=periodo("mespass"), pAno=periodo("ano");
  const rHoje=resumo(vendasNo(pHoje.de,pHoje.ate)), rSem=resumo(vendasNo(pSem.de,pSem.ate)),
        rMes=resumo(vendasNo(pMes.de,pMes.ate)), rMesP=resumo(vendasNo(pMesP.de,pMesP.ate)),
        rAno=resumo(vendasNo(pAno.de,pAno.ate));
  const varia = rMesP.receita ? (rMes.receita-rMesP.receita)/rMesP.receita : NaN;
  const ativos = DB.produtos.filter(p=>p.ativo!==false);
  const investido = ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0)*(p.custo||0),0);
  const potencial = ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0)*(p.preco||0),0);
  const top = categorias(vendasNo(pMes.de,pMes.ate),"modelo").slice(0,10);

  let h = cupomTopo("Relatório Gerencial", pMes.nome + " — " + dataBR(pMes.de) + " a " + dataBR(pMes.ate));

  h += cSec("Faturamento")
     + cL("Hoje", brl(rHoje.receita))
     + cL("Esta semana", brl(rSem.receita))
     + cL("Este mês", brl(rMes.receita))
     + cL("Mês passado", brl(rMesP.receita))
     + cL("Este ano", brl(rAno.receita))
     + (Number.isFinite(varia) ? cL("Mês x mês passado",
         (varia>=0?"+":"-") + pct(Math.abs(varia)), "forte") : "");

  h += cSec("Resultado do mês")
     + cL("Faturamento bruto", brl(rMes.receita + rMes.desconto))
     + cL("Descontos", "- " + brl(rMes.desconto))
     + cL("Faturamento líquido", brl(rMes.receita), "forte")
     + cL("Custo de aquisição", brl(rMes.custo))
     + cL("LUCRO BRUTO", brl(rMes.lucro), "destaque")
     + cL("Margem s/ venda", pct(rMes.margem))
     + cL("Markup praticado", pct(rMes.markup))
     + cL("Ticket médio", brl(rMes.ticket))
     + cL("Vendas / peças", `${rMes.vendas} / ${rMes.pecas}`);

  h += cSec("Capital em estoque")
     + cL("Peças", ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0),0))
     + cL("Investido (custo)", brl(investido))
     + cL("Potencial de venda", brl(potencial))
     + cL("Lucro a realizar", brl(potencial-investido), "forte")
     + cL("Markup do estoque", pct(investido ? (potencial-investido)/investido : NaN));

  h += cSec("Mais vendidos no mês");
  h += top.length
    ? top.map(x => cItem(`<b>${esc(x.chave)}</b> · ${x.qtd}pç`, brl(x.receita),
                         ["lucro", brl(x.lucro)])).join("")
    : `<div class="vazio-cupom">Sem vendas no mês</div>`;
  return h;
}

/** Relatório de clientes: quem comprou no período e aniversariantes. */
function cupomRelClientes(){
  const per = relPeriodo();
  const vendas = vendasNo(per.de, per.ate);
  const rank = rankingClientes(vendas);
  const ident = vendas.filter(v=>v.clienteId);
  const recIdent = ident.reduce((s,v)=>s+v.total,0);
  const recTot = vendas.reduce((s,v)=>s+v.total,0);
  const novos = DB.clientes.filter(c=>c.ativo!==false && c.criadoEm &&
    diaDe(c.criadoEm)>=per.de && diaDe(c.criadoEm)<=per.ate);
  const nivers = aniversariantesEm(per);

  let h = cupomTopo("Relatório de Clientes",
    `${per.nome}<br>${dataBR(per.de)} a ${dataBR(per.ate)}`);

  h += cSec("Resumo")
     + cL("Cadastrados (total)", DB.clientes.filter(c=>c.ativo!==false).length)
     + cL("Cadastros novos", novos.length)
     + cL("Clientes que compraram", rank.length)
     + cL("Vendas identificadas", `${ident.length} · ${brl(recIdent)}`)
     + cL("Sem identificação", `${vendas.length-ident.length} · ${brl(recTot-recIdent)}`)
     + cL("% do faturamento", pct(recTot ? recIdent/recTot : NaN), "forte")
     + cL("Gasto médio/cliente", brl(rank.length ? recIdent/rank.length : 0));

  h += cSec("Ranking do período");
  h += rank.length
    ? rank.map(l => { const c = cliente(l.id);
        return cItem(`<b>${esc(c ? c.nome : "(excluído)")}</b> · ${l.compras}x · ${l.pecas}pç`,
                     brl(l.receita), ["lucro gerado", brl(l.lucro)]); }).join("")
    : `<div class="vazio-cupom">Nenhuma venda vinculada a cliente</div>`;

  h += cSec("Aniversariantes do período");
  h += nivers.length
    ? nivers.map(a => cItem(`<b>${esc(a.quem)}</b> · ${a.tipo}<br>${esc(a.cliente.nome)} · ${esc(a.cliente.telefone||"sem tel.")}`,
                            dataBR(a.iso))).join("")
    : `<div class="vazio-cupom">Nenhum aniversário no período</div>`;
  return h;
}

/** Relatório de estoque: posição atual e o que precisa repor. */
function cupomRelEstoque(){
  const ativos = DB.produtos.filter(p=>p.ativo!==false)
    .sort((a,b)=>(a.marca||"").localeCompare(b.marca||"") || (a.modelo||"").localeCompare(b.modelo||""));
  const min = DB.config.estoqueMinimo||0;
  const baixos = ativos.filter(p=>(p.estoque||0)<=min);
  const investido = ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0)*(p.custo||0),0);
  const potencial = ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0)*(p.preco||0),0);

  let h = cupomTopo("Posição de Estoque");
  h += cSec("Resumo")
     + cL("Produtos", ativos.length)
     + cL("Peças", ativos.reduce((s,p)=>s+Math.max(0,p.estoque||0),0))
     + cL("Investido (custo)", brl(investido))
     + cL("Potencial de venda", brl(potencial))
     + cL("Lucro a realizar", brl(potencial-investido), "forte");

  h += cSec(`Repor (${min} peça(s) ou menos)`);
  h += baixos.length
    ? baixos.map(p => cItem(`<b>${esc(descProduto(p))}</b><br>${esc(p.codigo)}`,
                            (p.estoque||0)===0 ? "ZERADO" : String(p.estoque))).join("")
    : `<div class="vazio-cupom">Nenhuma peça em falta</div>`;

  h += cSec("Estoque completo");
  h += ativos.map(p => cItem(`<b>${esc(descProduto(p))}</b><br>venda ${nm(p.preco,2)} · custo ${nm(p.custo,2)}`,
                             String(p.estoque||0))).join("");
  return h;
}

/**
 * Imprime um relatório. Com papel térmico sai em coluna única na bobina;
 * com A4 escolhido nas Configurações, sai a tela cheia, com as tabelas.
 */
function imprimirRelatorio(tipo){
  if((DB.config.cupom||"80mm") === "a4") return imprimirTela();
  const montar = {vendas:cupomRelVendas, gestao:cupomRelGestao,
                  clientes:cupomRelClientes, estoque:cupomRelEstoque}[tipo];

  montarRelatorio(montar());
}

/** Imprime a prévia da troca sem gravar nada. */
function imprimirPreviaTroca(){
  if(!troca.entradas.length && !troca.saidas.length) return aviso("Não há itens para imprimir.","err");
  const itens = [...troca.saidas.map(i=>({...i})), ...troca.entradas.map(i=>({...i, qtd:-i.qtd}))];
  const sub = itens.reduce((s,i)=>s+i.preco*i.qtd,0);
  const des = numero(troca.desconto);
  montarRecibo({ numero:null, data:new Date().toISOString(), itens,
    subtotal:sub, desconto:des, total:sub-des,
    pagamento:$("#trocaPag")?.value || troca.pag || "—", clienteId:troca.cliente, tipo:"troca" }, true);
}

/** Ranking de clientes dentro do período, com identificadas x anônimas. */
function rankingClientes(vendas){
  const mapa = new Map();
  for(const v of vendas){
    if(!v.clienteId) continue;
    if(!mapa.has(v.clienteId)) mapa.set(v.clienteId,{id:v.clienteId, receita:0, custo:0, pecas:0, compras:0, ultima:null});
    const l = mapa.get(v.clienteId);
    l.receita += v.total; l.compras++;
    for(const i of v.itens){ l.custo += i.custo*i.qtd; l.pecas += i.qtd; }
    if(!l.ultima || v.data > l.ultima) l.ultima = v.data;
  }
  return [...mapa.values()].map(l=>({...l, lucro:l.receita-l.custo, ticket:l.receita/l.compras}))
    .sort((a,b)=>b.receita-a.receita);
}

function htmlRelClientes(vendas, per){
  const rank = rankingClientes(vendas);
  const ident = vendas.filter(v=>v.clienteId);
  const anon  = vendas.filter(v=>!v.clienteId);
  const recIdent = ident.reduce((s,v)=>s+v.total,0);
  const recTotal = vendas.reduce((s,v)=>s+v.total,0);
  const novos = DB.clientes.filter(c=>c.ativo!==false && c.criadoEm &&
    diaDe(c.criadoEm)>=per.de && diaDe(c.criadoEm)<=per.ate);

  const cab = `
    <div class="grid g4" style="padding:16px 18px">

/** Aniversários que caem dentro do período do relatório (ignora o ano). */
function aniversariantesEm(per){
  const dentro = (nasc) => {
    if(!nasc) return null;
    const md = nasc.slice(5,10);
    // percorre os anos cobertos pelo período e testa cada ocorrência
    for(let ano = +per.de.slice(0,4); ano <= +per.ate.slice(0,4); ano++){
      const iso = `${ano}-${md}`;
      if(iso >= per.de && iso <= per.ate) return iso;
    }
    return null;
  };
  const out = [];
  for(const c of DB.clientes.filter(c=>c.ativo!==false)){
    const d1 = dentro(c.nascimento);
    if(d1) out.push({cliente:c, quem:c.nome, tipo:"Comprador", iso:d1, nascimento:c.nascimento});
    for(const k of c.criancas||[]){
      const d2 = dentro(k.nascimento);
      if(d2) out.push({cliente:c, quem:k.nome||"Criança", tipo:"Criança", iso:d2, nascimento:k.nascimento});
    }
  }
  return out.sort((a,b)=>a.iso<b.iso?-1:1);
}

function htmlRelAniversarios(per){
  const l = aniversariantesEm(per);
  if(!l.length) return `<div class="vazio">Nenhum aniversário entre ${dataBR(per.de)} e ${dataBR(per.ate)}</div>`;
  return `<div class="tw"><table><thead><tr>
    <th>Quem</th><th>Tipo</th><th>Cliente</th><th>Data</th><th>Idade</th><th>Telefone</th><th class="noprint"></th>
  </tr></thead><tbody>${l.map(a=>`<tr>
    <td><b>${esc(a.quem)}</b></td>
    <td><span class="tag ${a.tipo==="Criança"?"f":"m"}">${a.tipo}</span></td>
    <td>${esc(a.cliente.nome)}</td><td>${dataBR(a.iso)}</td>
    <td>${+a.iso.slice(0,4) - +a.nascimento.slice(0,4)} anos</td>
    <td>${esc(a.cliente.telefone||"—")}</td>
    <td class="num noprint">${htmlZap(a.cliente, a)}</td>
  </tr>`).join("")}</tbody></table></div>`;
}

/** Agrupa vendas por dia/semana/mês/ano e devolve as linhas ordenadas. */
function serie(vendas, granularidade){
  const mapa = new Map();
  for(const v of vendas){
    const d = diaDe(v.data);
    let chave, nome;
    if(granularidade==="dia"){ chave = d; nome = dataBR(d); }
    else if(granularidade==="mes"){ chave = d.slice(0,7); nome = chave.slice(5)+"/"+chave.slice(0,4); }
    else if(granularidade==="ano"){ chave = d.slice(0,4); nome = chave; }
    else { const s = isoLocal(segunda(new Date(d+"T12:00:00"))); chave = s; nome = "sem. "+dataBR(s).slice(0,5); }
    if(!mapa.has(chave)) mapa.set(chave,{chave,nome,receita:0,custo:0,vendas:0,pecas:0});
    const l = mapa.get(chave);
    l.receita += v.total; l.vendas++;
    for(const i of v.itens){ l.custo += i.custo*i.qtd; l.pecas += i.qtd; }
  }
  return [...mapa.values()].sort((a,b)=>a.chave<b.chave?-1:1)
    .map(l=>({...l, lucro:l.receita-l.custo, margem:l.receita?(l.receita-l.custo)/l.receita:NaN}));
}

function htmlSerie(vendas, gran){

/** Quebra as vendas por atributo do produto (ou forma de pagamento). */
function categorias(vendas, campo){
  const mapa = new Map();
  for(const v of vendas){
    for(const i of v.itens){
      const p = produto(i.produtoId);
      let chave;
      if(campo==="pagamento") chave = v.pagamento;
      else chave = p ? (p[campo]||"—") : (campo==="modelo" ? i.desc : "(excluído)");
      if(!mapa.has(chave)) mapa.set(chave,{chave, receita:0, custo:0, qtd:0});
      const l = mapa.get(chave);
      l.receita += i.preco*i.qtd; l.custo += i.custo*i.qtd; l.qtd += i.qtd;
    }
  }
  return [...mapa.values()].map(l=>({...l, lucro:l.receita-l.custo,
      margem:l.receita?(l.receita-l.custo)/l.receita:NaN, markup:l.custo?(l.receita-l.custo)/l.custo:NaN}))
    .sort((a,b)=>b.receita-a.receita);
}

function htmlCategoria(vendas, campo){
  const l = categorias(vendas, campo);
  if(!l.length) return `<div class="vazio"><b>Sem vendas no período</b></div>`;
  const tot = l.reduce((s,x)=>s+x.receita,0) || 1;
  return `<div class="tw"><table><thead><tr>
    <th>${({marca:"Marca",modelo:"Modelo",tamanho:"Tamanho",cor:"Cor",genero:"Gênero",pagamento:"Pagamento"})[campo]}</th>

    <th class="num">Custo</th><th class="num">Lucro</th><th class="num">Markup</th><th style="width:130px">Participação</th>
  </tr></thead><tbody>${l.map(x=>`<tr>
    <td><b>${campo==="genero"?tagGenero(x.chave):esc(x.chave)}</b></td>
    <td class="num">${x.qtd}</td><td class="num"><b>${brl(x.receita)}</b></td>
    <td class="num">${pct(x.receita/tot)}</td>
    <td class="num hint">${brl(x.custo)}</td>
    <td class="num ${x.lucro>=0?"pos":"neg"}"><b>${brl(x.lucro)}</b></td>

  </tr>`).join("")}</tbody></table></div>`;
}

        <ul class="hint" style="margin:10px 0 0;padding-left:18px">
          <li><b>Produtos</b> — código novo abre o cadastro; código já existente abre a ficha da peça.</li>
          <li><b>Venda</b> — cada leitura joga a peça no carrinho; ler duas vezes soma quantidade.</li>
          <li>Se a peça não tiver etiqueta de fábrica, use etiquetas próprias com numeração sequencial (ex.: 1001, 1002…).</li>
        </ul>
      </div>
    </div>

    <div class="card" style="border-color:#f0c9c5">
      <div class="ch"><h3 style="color:var(--coral)">Zona de risco</h3></div>
      <div class="cb">
        <p class="hint" style="margin-top:0">Ações irreversíveis. Baixe um backup antes.</p>
        <div class="row">
          <button class="btn sec" onclick="dadosDemo()">Carregar dados de demonstração</button>
          <button class="btn dan" onclick="apagarTudo()">Apagar todos os dados</button>
        </div>
      </div>
    </div>
  </div>`;
}

function baixarBackup(){
  const nome = `kavakids-backup-${hoje()}.json`;
  baixar(nome, JSON.stringify(DB,null,1), "application/json");
  DB.config.ultimoBackup = new Date().toISOString();
  salvar(); render();
  aviso("Backup baixado. Guarde em local seguro.","ok");
}
function restaurarBackup(input){
  const f = input.files[0]; if(!f) return;
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!Array.isArray(d.produtos)) throw new Error("formato");
      confirmar("Restaurar backup",
        `O backup tem <b>${d.produtos.length} produtos</b> e <b>${(d.vendas||[]).length} vendas</b>.<br><br>
         Isso <b>substitui</b> todos os dados atuais.`,
        ()=>{ DB = Object.assign(structuredClone(VAZIO), d); salvar(); render(); aviso("Backup restaurado.","ok"); },
        "Restaurar");
    }catch(e){ aviso("Arquivo inválido.","err"); }
  };
  fr.readAsText(f); input.value = "";
}
function apagarTudo(){
  confirmar("Apagar todos os dados",
    "Isso apaga <b>produtos, vendas e estoque</b> definitivamente. Não há como desfazer sem um backup.",
    ()=>{ DB = structuredClone(VAZIO); salvar(); carrinho=[]; render(); aviso("Tudo apagado.","ok"); },
    "Apagar tudo");
}

function baixar(nome, conteudo, tipo){
  const url = URL.createObjectURL(new Blob(["﻿"+conteudo],{type:tipo+";charset=utf-8"}));
  const a = document.createElement("a"); a.href = url; a.download = nome;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1500);
}
const csvC = v => `"${String(v??"").replace(/"/g,'""')}"`;

function exportarCSV(tipo){
  let cab, linhas, nome;
  if(tipo==="produtos"){
    nome = "produtos"; cab = ["Codigo","Marca","Modelo","Tamanho","Cor","Genero","Custo","Venda","Markup %","Estoque"];
    linhas = DB.produtos.filter(p=>p.ativo!==false).map(p=>[p.codigo,p.marca,p.modelo,p.tamanho,p.cor,p.genero,
      nm(p.custo,2),nm(p.preco,2), markup(p)===null?"":nm(markup(p)*100,1), p.estoque||0]);
  }else if(tipo==="clientes"){
    nome = "clientes"; cab = ["Nome","Aniversario","Telefone","E-mail","CPF","Criancas","Compras","Total gasto","Ticket medio","Ultima compra","Observacoes"];
    linhas = DB.clientes.filter(c=>c.ativo!==false).sort((a,b)=>a.nome.localeCompare(b.nome)).map(c=>{
      const r = resumoCliente(c.id);
      return [c.nome, c.nascimento?dataBR(c.nascimento):"", c.telefone, c.email, c.cpf,
        (c.criancas||[]).map(k=>`${k.nome||"?"}${k.nascimento?" ("+dataBR(k.nascimento)+")":""}`).join(" | "),
        r.vendas, nm(r.receita,2), nm(r.ticket,2), r.ultima?dataBR(r.ultima):"", c.obs];
    });
  }else if(tipo==="relclientes"){
    const per = relPeriodo();
    nome = "clientes-periodo"; cab = ["Cliente","Telefone","E-mail","Compras","Pecas","Faturamento","Ticket medio","Lucro gerado","Ultima compra"];
    linhas = rankingClientes(vendasNo(per.de, per.ate)).map(l=>{ const c = cliente(l.id);
      return [c?.nome||"(excluido)", c?.telefone||"", c?.email||"", l.compras, l.pecas,
        nm(l.receita,2), nm(l.ticket,2), nm(l.lucro,2), dataBR(l.ultima)]; });
  }else if(tipo==="movimentos"){
    nome = "estoque"; cab = ["Data","Codigo","Peca","Movimento","Tipo","Qtd","Saldo","Observacao"];
    linhas = DB.movimentos.map(m=>{ const p=produto(m.produtoId);
      return [dataBR(m.data), m.codigo, p?descProduto(p):"", MOTIVOS[m.motivo].r, m.tipo, m.delta, m.saldo, m.obs]; });
  }else{
    const per = tipo==="relatorio" ? relPeriodo() : periodo(filtroVenda.periodo);
    nome = "vendas"; cab = ["Venda","Data","Hora","Codigo","Peca","Marca","Tamanho","Cor","Genero","Qtd","Unitario","Custo unit","Total item","Pagamento","Desconto venda","Total venda"];
    linhas = [];
    for(const v of vendasNo(per.de, per.ate)){
      for(const i of v.itens){ const p = produto(i.produtoId);
        linhas.push([v.numero, dataBR(v.data), horaBR(v.data), i.codigo, i.desc, p?.marca||"", p?.tamanho||"", p?.cor||"", p?.genero||"",
          i.qtd, nm(i.preco,2), nm(i.custo,2), nm(i.preco*i.qtd,2), v.pagamento, nm(v.desconto,2), nm(v.total,2)]);
      }
    }
  }
  if(!linhas.length) return aviso("Nada para exportar.","err");
  baixar(`kavakids-${nome}-${hoje()}.csv`,
    [cab, ...linhas].map(l=>l.map(csvC).join(";")).join("\r\n"), "text/csv");
  aviso("CSV gerado.","ok");
}

      ];
      const DIAS = 180;
      const recuar = n => { const x = new Date(); x.setDate(x.getDate()-n); x.setHours(9,0,0,0); return x; };
      for(const [cod,marca,modelo,tam,cor,gen,custo,preco] of base){

      }
      // clientes de exemplo — os primeiros têm aniversário perto de hoje, para demonstrar o aviso
      const perto = n => { const d=new Date(); d.setDate(d.getDate()+n); return `${1990+Math.floor(Math.random()*15)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
      const pertoKid = n => { const d=new Date(); d.setDate(d.getDate()+n); return `${2017+Math.floor(Math.random()*6)}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
      const clis = [
        ["Ana Paula Ribeiro","(11) 98812-4471","ana.ribeiro@email.com","111.444.777-35", perto(2), [["Lívia Ribeiro", pertoKid(30)]]],
        ["Carla Menezes",    "(11) 99143-2280","carla.menezes@email.com","", perto(40), [["Theo Menezes", pertoKid(5)],["Bento Menezes", pertoKid(120)]]],
        ["Juliana Prado",    "(11) 98330-1177","ju.prado@email.com","", perto(0), [["Manu Prado", pertoKid(200)]]],
        ["Fernanda Lima",    "(11) 97744-9021","fe.lima@email.com","", perto(95), [["Alice Lima", pertoKid(60)]]],
        ["Patrícia Souza",   "(11) 98219-3355","","", perto(150), [["Miguel Souza", pertoKid(15)]]],
        ["Roberta Alves",    "(11) 99502-7788","roberta.alves@email.com","", perto(210), [["Cecília Alves", pertoKid(250)],["Pedro Alves", pertoKid(300)]]],
        ["Marina Castro",    "(11) 98077-6612","","", perto(75), []],
        ["Débora Nunes",     "(11) 99661-4433","debora.nunes@email.com","", perto(310), [["Isabela Nunes", pertoKid(90)]]]
      ];
      for(const [nome,tel,mail,cpf,nasc,kids] of clis){
        DB.clientes.push({ id:uid(), nome, telefone:tel, email:mail, cpf, nascimento:nasc,
          criancas: kids.map(([n,d])=>({nome:n, nascimento:d})),
          obs:"", ativo:true, criadoEm: recuar(DIAS).toISOString() });
      }

      const pags = ["Dinheiro","PIX","Débito","Crédito","Crédito parcelado"];
      for(let d=DIAS; d>=0; d--){
        const dia = recuar(d);
        // reposição de estoque a cada 30 dias, como acontece na loja
        if(d < DIAS && d % 30 === 0){
          for(const p of DB.produtos)
            movimentar(p.id,"compra", 8+Math.floor(Math.random()*7),
              {custo:p.custo, obs:"Reposição de estoque (demonstração)", data:dia.toISOString()});
        }
        const n = Math.floor(Math.random()*4) + (dia.getDay()===6?2:0);
        for(let k=0;k<n;k++){
          const itens = [];
          const usados = new Set();
          const qi = 1 + Math.floor(Math.random()*3);
          for(let j=0;j<qi;j++){
            const p = DB.produtos[Math.floor(Math.random()*DB.produtos.length)];
            if(p.estoque < 1 || usados.has(p.id)) continue;
            usados.add(p.id);
            itens.push({produtoId:p.id, codigo:p.codigo, desc:descProduto(p), qtd:1, preco:p.preco, custo:p.custo});
          }
          if(!itens.length) continue;
          const sub = itens.reduce((s,i)=>s+i.preco*i.qtd,0);
          const des = Math.random()<.25 ? Math.round(sub*0.08) : 0;
          dia.setHours(9+Math.floor(Math.random()*10), Math.floor(Math.random()*60), 0, 0);
          const v = {id:uid(), numero:DB.seqVenda++, data:dia.toISOString(), itens,
            subtotal:sub, desconto:des, total:sub-des,
            custo:itens.reduce((s,i)=>s+i.custo*i.qtd,0), pagamento:pags[Math.floor(Math.random()*pags.length)],

            // ~65% das vendas saem identificadas, como acontece na prática
            clienteId: Math.random()<.65 ? DB.clientes[Math.floor(Math.random()*DB.clientes.length)].id : null};
          v.lucro = v.total - v.custo;
          DB.vendas.push(v);
          for(const i of itens) movimentar(i.produtoId,"venda",i.qtd,{vendaId:v.id, custo:i.custo, data:dia.toISOString()});
        }

        // de vez em quando alguém volta para trocar uma peça
        if(d < DIAS-7 && Math.random() < .10){
          const dev = DB.produtos[Math.floor(Math.random()*DB.produtos.length)];
          const lev = DB.produtos.filter(x=>x.id!==dev.id && x.estoque>0)[0];
          if(lev){
            const itens = [
              {produtoId:lev.id, codigo:lev.codigo, desc:descProduto(lev), qtd: 1, preco:lev.preco, custo:lev.custo},
              {produtoId:dev.id, codigo:dev.codigo, desc:descProduto(dev), qtd:-1, preco:dev.preco, custo:dev.custo}
            ];
            const sub = itens.reduce((s,i)=>s+i.preco*i.qtd,0);
            dia.setHours(14+Math.floor(Math.random()*4), Math.floor(Math.random()*60), 0, 0);
            const t = {id:uid(), numero:DB.seqVenda++, data:dia.toISOString(), itens,
              subtotal:sub, desconto:0, total:sub,
              custo:itens.reduce((s,i)=>s+i.custo*i.qtd,0),
              pagamento: sub>0 ? "PIX" : "Vale-compra", obs:"Tamanho não serviu",
              tipo:"troca", cancelada:false,
              clienteId: DB.clientes[Math.floor(Math.random()*DB.clientes.length)].id};
            t.lucro = t.total - t.custo;
            DB.vendas.push(t);
            movimentar(lev.id,"venda",1,{vendaId:t.id, custo:lev.custo, data:dia.toISOString(), obs:`Peça levada na troca #${t.numero}`});
            movimentar(dev.id,"troca_entrada",1,{vendaId:t.id, custo:dev.custo, data:dia.toISOString(), obs:`Peça devolvida na troca #${t.numero}`});
          }
        }
      }
      salvar(); irPara("gestao"); aviso("Dados de demonstração carregados.","ok");
      setTimeout(()=>popupAniversarios(true), 400);
    }, "Carregar demonstração");
}

/* =======================================================================
   AVISO DE ANIVERSÁRIO — popup ao abrir, uma vez por dia
   ======================================================================= */
function popupAniversarios(forcar){
  const lista = aniversarios(7);
  if(!lista.length){ if(forcar) aviso("Nenhum aniversário nos próximos 7 dias.","ok"); return; }
  if(!forcar && DB.config.ultimoAvisoAniv === hoje()) return;   // já avisou hoje

  DB.config.ultimoAvisoAniv = hoje(); salvar();

  const linha = a => `
    <div style="display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;
                background:${a.dias===0?"#FFF3D6":"var(--laranja-fraco)"};margin-bottom:8px">
      <div style="font-size:26px;line-height:1">${a.dias===0?"🎉":"🎂"}</div>
      <div style="flex:1;min-width:0">
        <b>${esc(a.quem)}</b> ${a.tipo==="Criança"?`<span class="tag f">Criança</span>`:`<span class="tag m">Comprador</span>`}
        <div class="hint">Faz <b>${a.idade} anos</b> ${quandoAniv(a.dias)} — ${dataBR(a.iso)}</div>
        ${a.tipo==="Criança"?`<div class="hint">Responsável: ${esc(a.cliente.nome)}</div>`:""}
      </div>
      <div style="flex:none;text-align:right">
        <div class="hint">${esc(a.cliente.telefone||"sem telefone")}</div>
        ${htmlZap(a.cliente, a)}
        <button class="btn gh sm" onclick="fechar();fichaCliente('${a.cliente.id}')">Ficha</button>
      </div>
    </div>`;

  const hj = lista.filter(a=>a.dias===0);
  modal(`🎂 ${lista.length} aniversário${lista.length>1?"s":""} nos próximos 7 dias`,
    (hj.length ? `<h4 style="font-size:14px;color:var(--marrom);margin:0 0 8px">Hoje</h4>${hj.map(linha).join("")}
                  <h4 style="font-size:14px;color:var(--marrom);margin:16px 0 8px">Nos próximos dias</h4>` : "")
    + lista.filter(a=>a.dias>0).map(linha).join("")
    + `<p class="hint" style="margin:14px 0 0">Este aviso aparece uma vez por dia. Você pode revê-lo a
       qualquer momento na tela de Clientes.</p>`,
    `<button class="btn" onclick="fechar()">Entendi</button>`, true);
}

/* ---------- ATALHOS ---------- */
document.addEventListener("keydown", e => {
  if(tela==="troca" && (e.key==="F2" || e.key==="F3")){
    e.preventDefault(); setModoTroca(e.key==="F2" ? "entrada" : "saida"); return;
  }
  // Os atalhos exigem Alt de propósito: um leitor de código de barras digita
  // números muito rápido e, sem isso, o código trocaria de tela no meio da leitura.
  if(!e.altKey || e.ctrlKey || e.metaKey) return;
  if(typeof e.target?.matches === "function" && e.target.matches("input,select,textarea")) return;
  const map = {"1":"pdv","2":"troca","3":"produtos","4":"clientes","5":"estoque","6":"vendas","7":"relatorios","8":"gestao"};
  if(map[e.key]){ e.preventDefault(); irPara(map[e.key]); }
});
